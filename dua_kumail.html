<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Молитвата на Кумайл</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F4F3F6; --sheet:#FFFFFF; --ink:#1D1A24; --muted:#625D6E; --deep:#4B3B78; --gold:#9A7630; --rule:#DFDCE6; --wash:#ECE9F2;
  --s-ar:1.2; --s-tr:1; --s-bg:1;
  --serif:"Literata", "Noto Serif", Georgia, serif;
  --tr:"Noto Serif", "Literata", Georgia, serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arf:"Amiri", "Traditional Arabic", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121019; --sheet:#1A1723; --ink:#E9E6F0; --muted:#A39DB2; --deep:#B9A6EA; --gold:#D8B66E; --rule:#2B2735; --wash:#211D2B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121019; --sheet:#1A1723; --ink:#E9E6F0; --muted:#A39DB2; --deep:#B9A6EA; --gold:#D8B66E; --rule:#2B2735; --wash:#211D2B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* arabic image rendered as a mask so it follows the theme colour */
.arimg{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:right center;mask-position:right center;max-width:100%;margin-left:auto;color:var(--ink)}
.hon,.arw{unicode-bidi:isolate}
.hon{font-family:var(--arf);font-size:.95em;color:var(--gold);white-space:nowrap}
.arw{font-family:var(--arf);font-size:1.25em;color:var(--deep)}

/* bar */
.bar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--sans)}
.bar-title{font:600 16px var(--sans);color:var(--ink);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{appearance:none;-webkit-appearance:none;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 30px 7px 10px;font:500 15px var(--sans);color:var(--ink);max-width:44vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* settings */
.panel{position:fixed;z-index:30;right:max(12px,calc((100vw - 820px)/2 + 12px));top:calc(env(safe-area-inset-top,0px) + 60px);width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;font-family:var(--sans);box-shadow:0 14px 40px rgba(8,20,18,.2);display:none}
.panel.open{display:block}
.panel h3{margin:0 0 6px;font:500 13px var(--sans);color:var(--muted)}
.grp+.grp{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px;cursor:pointer}
.tog small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.tog input{flex:none;appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--rule);position:relative;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--deep)}
.tog input:checked::after{transform:translateX(18px)}
.step{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:16px}
.ctl{display:inline-flex;align-items:center;gap:4px}
.ctl button{width:34px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:18px;line-height:1}
.ctl output{min-width:44px;text-align:center;font-size:14px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;border:0;background:transparent;cursor:pointer;font-size:15px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--paper)}

/* hero */
.hero{max-width:820px;margin:0 auto;padding:56px 20px 24px;text-align:center}
.hero .cal{margin:0 auto;width:min(420px,84%)}
.hero h1{font:400 clamp(26px,5vw,36px)/1.2 var(--serif);margin:28px 0 8px;letter-spacing:.005em}
.hero p.sub{margin:0 auto;max-width:34em;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:var(--paper);font:500 16px var(--sans);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep)}

.contents{max-width:760px;margin:24px auto 0;padding:0 20px;text-align:left;font-family:var(--sans)}
.contents h2{font:500 14px var(--sans);color:var(--muted);margin:26px 0 8px}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:16px}
.toc a span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid a{display:flex;align-items:center;justify-content:center;height:42px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);text-decoration:none;color:var(--ink);font:500 15px var(--sans)}@media (hover:hover){.grid a:hover{border-color:var(--deep);color:var(--deep)}}
.grid a.cur{background:var(--deep);border-color:var(--deep);color:var(--paper)}

/* reader */
main{max-width:760px;margin:0 auto;padding:0 20px 80px}
.sec{padding-top:44px}
.sec>h2{font:400 clamp(24px,4vw,30px)/1.25 var(--serif);margin:0 0 6px}
.sec>.lede{color:var(--muted);font:400 15px/1.5 var(--sans);margin:0 0 18px}
.prose p{margin:0 0 1em;hyphens:auto;-webkit-hyphens:auto}
.prose h3{font:italic 400 20px var(--serif);color:var(--deep);margin:1.4em 0 .4em}
.prose b{font-weight:600}

.item{position:relative;display:grid;grid-template-columns:40px 1fr;gap:4px 14px;padding:22px 0;border-bottom:1px solid var(--rule)}
.item:first-of-type{border-top:1px solid var(--rule)}
.num{font:600 15px/1 var(--sans);color:var(--gold);padding-top:8px;text-align:left}
.num a{color:inherit;text-decoration:none}
.body{min-width:0}
.item.plain{grid-template-columns:1fr}
.item.plain .num{display:none}
.ar{margin:0 0 12px}
.tr{font-family:var(--tr);font-style:italic;color:var(--deep);font-size:calc(17px*var(--s-tr));line-height:1.55;margin:0 0 8px}
.tr .y{font-style:normal;font-weight:400}
.bg{font-size:calc(17.5px*var(--s-bg));line-height:1.6;margin:0}
.bg .nm{font-weight:600}
.bg .nm .x{font-weight:400}
.bg .ay{display:block;margin-top:4px}
.x{color:var(--muted);font-size:.86em}
body.nox .x{display:none}
body.noar .ar, body.notr .tr, body.nobg .bg{display:none}
.item.cur{background:linear-gradient(90deg,var(--wash),transparent 85%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.rep{font:400 13px var(--sans);color:var(--muted);margin-top:6px}

/* appendices */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:12px 0 18px;direction:rtl}
.lt{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lt .a{font-family:var(--arf);font-size:28px;line-height:1.1}
.lt .c{font-family:var(--tr);font-size:18px;text-align:right}
.lt .c small{color:var(--muted);font-size:12px;font-family:var(--sans)}
.vow{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:16px}
.vow th{font:500 13px var(--sans);color:var(--muted);text-align:left;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.vow td{padding:8px 0;border-bottom:1px solid var(--rule)}
.vow td:first-child{font-family:var(--tr)}
.vow td:last-child{color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 1.2em;direction:rtl}
.chips a{direction:ltr;display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);text-decoration:none;color:var(--ink)}
.chips a b{font:500 12px var(--sans);color:var(--gold)}
.chips a span{font-family:var(--arf);font-size:19px}
.corr{border-top:1px solid var(--rule);margin-top:12px}
.corr div{padding:14px 0;border-bottom:1px solid var(--rule)}
.corr p{margin:6px 0 0;font-family:var(--tr);font-style:italic;color:var(--deep);font-size:16px}

.arflow{display:flex;flex-wrap:wrap;direction:rtl;align-items:flex-end;column-gap:calc(7px*var(--s-ar));row-gap:0}
.arflow .arimg{margin:0;flex:none}
/* focus */
.focus{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.focus.open{display:flex}
.f-top{display:flex;align-items:center;gap:10px;max-width:820px;width:100%;margin:0 auto;padding:10px 16px;font-family:var(--sans)}
.f-top .where{margin-right:auto;font-size:15px;color:var(--muted)}
.prog{height:3px;background:var(--rule);max-width:820px;width:calc(100% - 32px);margin:0 auto;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.f-body{flex:1;overflow:auto;width:100%;max-width:760px;margin:0 auto;padding:28px 20px}
.f-body .fnum{font:600 15px var(--sans);color:var(--gold);margin-bottom:14px}
.f-body .ar{margin-bottom:22px}
.f-body .tr{font-size:calc(19px*var(--s-tr))}
.f-body .bg{font-size:calc(19px*var(--s-bg))}
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;margin:30px 0 4px}
.tap{width:132px;height:132px;border-radius:50%;border:2px solid var(--deep);background:var(--sheet);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
.tap svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);transform:rotate(-90deg)}
.tap circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .15s}
.tap b{font:600 34px/1 var(--sans);color:var(--ink)}
.tap span{font-size:13px;color:var(--muted);margin-top:4px}
.tap.done{background:var(--deep);border-color:var(--deep)}
.tap.done b,.tap.done span{color:var(--paper)}
.tap:active{transform:scale(.97)}
.counter .hint{font:400 13px var(--sans);color:var(--muted);text-align:center}
.counter .reset{border:0;background:none;color:var(--muted);font:400 14px var(--sans);text-decoration:underline;cursor:pointer}
.f-nav{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;padding:10px 16px 14px}
.f-nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font:500 16px var(--sans);cursor:pointer}
.f-nav .next{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.f-nav button:disabled{opacity:.4;cursor:default}

@media (max-width:520px){
  body{font-size:17px}
  .item{grid-template-columns:30px 1fr;gap:4px 10px}
  .hero{padding-top:36px}
}
</style>

<style id="zk-nav">.bar-in .bar-title{display:none}.zk-home{flex:0 1 auto;min-width:0;max-width:min(52vw,340px);display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}.zk-home span{overflow:hidden;text-overflow:ellipsis}.zk-home svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media (hover:hover){.zk-home:hover,.zk-flag:hover{border-color:var(--gold)}}.zk-flag{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet)}.zk-flag svg{width:24px;height:16px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}.bar-in .sel{flex:1 1 0;min-width:0}@media (max-width:479px){.bar-in .sel{max-width:none;min-width:84px}.zk-home{max-width:40vw}}.zk-alt{color:var(--ink)}.zk-alt svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;box-shadow:none;border-radius:0}.zk-ver{display:grid;justify-items:center;gap:8px;margin:22px auto 0;font-family:var(--sans)}.zk-ver small{font-size:13px;color:var(--muted);letter-spacing:.04em}.zk-seg{display:inline-flex;border:1px solid var(--deep);border-radius:999px;overflow:hidden}.zk-seg a,.zk-seg span{padding:8px 16px;font-size:15px;font-weight:500;text-decoration:none;color:var(--deep)}.zk-seg span{background:var(--deep);color:var(--paper)}@media (hover:hover){.zk-seg a:hover{background:color-mix(in srgb,var(--deep) 12%,transparent)}}.zk-ver p{margin:0;font-size:14px;color:var(--muted);max-width:40ch;text-align:center}main p,main li{overflow-wrap:break-word}</style>

аш гласа му и виждаш мястото му? И как би го обхванало съскането на огъня, след като Ти знаеш слабостта му? И как би проникнал в недрата на Ада, след като Ти знаеш искреността му? И как би му креснало адското войнство, след като той Те призовава: О, Господи! И как, надявайки се на Твоята щедрост, да го освободиш от огъня, Ти би го оставил в него? Това е далеч от Теб – така не бива да се мисли за Теб и не такава е твоята щедрост. Безподобна е Твоята доброта и любов към онези, които казват, че Ти си Един."},{"ar":[{"w":93.9,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"5.8 0.6 29.8 29.8 44.0 52.8 44.0 63.1 70.6 71.9 82.6 82.6\" y=\"45.6 39.5 41.1 39.5 26.5 11.0 39.5 39.5 45.6 39.5 16.5 39.5\"><\/text>"},{"w":61.1,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"39.2 38.3 50.6 51.6 4.9 1.3 26.3 18.5\" y=\"15.2 39.5 5.1 39.5 23.6 39.5 23.0 39.5\"><\/text>"},{"w":26.8,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"-0.0\" y=\"39.5\"><\/text>"},{"w":55.5,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"23.2 21.9 35.9 45.3 47.9 13.2 -0.1\" y=\"23.3 39.5 39.5 12.6 39.5 11.3 39.5\"><\/text>"},{"w":127.2,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"114.4 111.8 10.4 0.6 30.5 43.7 42.4 60.9 57.7 84.2 80.7 103.0\" y=\"22.0 39.5 23.0 39.5 39.5 22.3 39.5 13.9 39.5 22.0 39.5 39.5\"><\/text>"},{"w":36.7,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"0.3 0.6 14.8 24.3 26.8\" y=\"39.8 39.5 39.5 46.3 39.5\"><\/text>"},{"w":48.8,"h":60,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"5.5 0.7 21.4 33.7 33.4\" y=\"23.0 39.5 39.5 39.2 39.5\"><\/text>"},{"w":84.0,"h":61,"svg":"<text font-family=\"zkdua100\" font-size=\"37.99\" x=\"8.4 0.6 30.4 42.1 39.8 58.9 58.0 73.2 72.2\" y=\"47.8 40.4 40.4 41.4 40.4 21.6 40.4 19.6 40.4\"><\/text>"},{"w":110.7,"h":61,"svg":"<text font-family=\"zkdua100\" f })();
