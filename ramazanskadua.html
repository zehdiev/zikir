<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рамазанската дюа</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F4F6F2; --sheet:#FFFFFF; --ink:#18211F; --muted:#5D6966; --deep:#1D5B53; --gold:#9A7428; --rule:#DCE2DD; --wash:#E9EFEA;
  --s-ar:1; --s-tr:1; --s-bg:1;
  --serif:"Literata", "Noto Serif", Georgia, serif;
  --tr:"Noto Serif", "Literata", Georgia, serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arf:"Amiri", "Traditional Arabic", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1514; --sheet:#141D1C; --ink:#E6ECE7; --muted:#9BAAA5; --deep:#8CC9BC; --gold:#D6B266; --rule:#25312F; --wash:#1A2624; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1514; --sheet:#141D1C; --ink:#E6ECE7; --muted:#9BAAA5; --deep:#8CC9BC; --gold:#D6B266; --rule:#25312F; --wash:#1A2624; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* arabic image rendered as a mask so it follows the theme colour */
.arimg{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:right center;mask-position:right center;max-width:100%;margin-left:auto}
.hon,.arw{unicode-bidi:isolate}
.hon{font-family:var(--arf);font-size:.95em;color:var(--gold);white-space:nowrap}
.arw{font-family:var(--arf);font-size:1.25em;color:var(--deep)}

/* bar */
.bar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--sans)}
.bar-title{font:600 16px var(--sans);color:var(--ink);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{appearance:none;-webkit-appearance:none;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 30px 7px 10px;font:500 15px var(--sans);color:var(--ink);max-width:44vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* settings */
.panel{position:fixed;z-index:30;right:max(12px,calc((100vw - 820px)/2 + 12px));top:calc(env(safe-area-inset-top,0px) + 60px);width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;font-family:var(--sans);box-shadow:0 14px 40px rgba(8,20,18,.2);display:none}
.panel.open{display:block}
.panel h3{margin:0 0 6px;font:500 13px var(--sans);color:var(--muted)}
.grp+.grp{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px;cursor:pointer}
.tog small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.tog input{flex:none;appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--rule);position:relative;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--deep)}
.tog input:checked::after{transform:translateX(18px)}
.step{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:16px}
.ctl{display:inline-flex;align-items:center;gap:4px}
.ctl button{width:34px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:18px;line-height:1}
.ctl output{min-width:44px;text-align:center;font-size:14px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;border:0;background:transparent;cursor:pointer;font-size:15px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--paper)}

/* hero */
.hero{max-width:820px;margin:0 auto;padding:56px 20px 24px;text-align:center}
.hero .cal{margin:0 auto;width:min(560px,92%)}
.hero h1{font:400 clamp(26px,5vw,36px)/1.2 var(--serif);margin:28px 0 8px;letter-spacing:.005em}
.hero p.sub{margin:0 auto;max-width:34em;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:var(--paper);font:500 16px var(--sans);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep)}

.contents{max-width:760px;margin:24px auto 0;padding:0 20px;text-align:left;font-family:var(--sans)}
.contents h2{font:500 14px var(--sans);color:var(--muted);margin:26px 0 8px}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:16px}
.toc a span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid a{display:flex;align-items:center;justify-content:center;height:42px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);text-decoration:none;color:var(--ink);font:500 15px var(--sans)}
.grid a:hover{border-color:var(--deep);color:var(--deep)}
.grid a.cur{background:var(--deep);border-color:var(--deep);color:var(--paper)}

/* reader */
main{max-width:760px;margin:0 auto;padding:0 20px 80px}
.sec{padding-top:44px}
.sec>h2{font:400 clamp(24px,4vw,30px)/1.25 var(--serif);margin:0 0 6px}
.sec>.lede{color:var(--muted);font:400 15px/1.5 var(--sans);margin:0 0 18px}
.prose p{margin:0 0 1em;hyphens:auto;-webkit-hyphens:auto}
.prose h3{font:italic 400 20px var(--serif);color:var(--deep);margin:1.4em 0 .4em}
.prose b{font-weight:600}

.item{position:relative;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:22px 0;border-bottom:1px solid var(--rule)}
.item:first-of-type{border-top:1px solid var(--rule)}
.num{font:600 15px/1 var(--sans);color:var(--gold);padding-top:8px;text-align:left}
.num a{color:inherit;text-decoration:none}
.body{min-width:0}
.item.plain{grid-template-columns:1fr}
.item.plain .num{display:none}
.ar{margin:0 0 12px}
.tr{font-family:var(--tr);font-style:italic;color:var(--deep);font-size:calc(17px*var(--s-tr));line-height:1.55;margin:0 0 8px}
.tr .y{font-style:normal;font-weight:400}
.bg{font-size:calc(17.5px*var(--s-bg));line-height:1.6;margin:0}
.bg .nm{font-weight:600}
.bg .nm .x{font-weight:400}
.bg .ay{display:block;margin-top:4px}
.x{color:var(--muted);font-size:.86em}
body.nox .x{display:none}
body.noar .ar, body.notr .tr, body.nobg .bg{display:none}
.item.cur{background:linear-gradient(90deg,var(--wash),transparent 85%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.rep{font:400 13px var(--sans);color:var(--muted);margin-top:6px}

/* appendices */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:12px 0 18px;direction:rtl}
.lt{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lt .a{font-family:var(--arf);font-size:28px;line-height:1.1}
.lt .c{font-family:var(--tr);font-size:18px;text-align:right}
.lt .c small{color:var(--muted);font-size:12px;font-family:var(--sans)}
.vow{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:16px}
.vow th{font:500 13px var(--sans);color:var(--muted);text-align:left;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.vow td{padding:8px 0;border-bottom:1px solid var(--rule)}
.vow td:first-child{font-family:var(--tr)}
.vow td:last-child{color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 1.2em;direction:rtl}
.chips a{direction:ltr;display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);text-decoration:none;color:var(--ink)}
.chips a b{font:500 12px var(--sans);color:var(--gold)}
.chips a span{font-family:var(--arf);font-size:19px}
.corr{border-top:1px solid var(--rule);margin-top:12px}
.corr div{padding:14px 0;border-bottom:1px solid var(--rule)}
.corr p{margin:6px 0 0;font-family:var(--tr);font-style:italic;color:var(--deep);font-size:16px}

/* focus */
.focus{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.focus.open{display:flex}
.f-top{display:flex;align-items:center;gap:10px;max-width:820px;width:100%;margin:0 auto;padding:10px 16px;font-family:var(--sans)}
.f-top .where{margin-right:auto;font-size:15px;color:var(--muted)}
.prog{height:3px;background:var(--rule);max-width:820px;width:calc(100% - 32px);margin:0 auto;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.f-body{flex:1;overflow:auto;width:100%;max-width:760px;margin:0 auto;padding:28px 20px}
.f-body .fnum{font:600 15px var(--sans);color:var(--gold);margin-bottom:14px}
.f-body .ar{margin-bottom:22px}
.f-body .tr{font-size:calc(19px*var(--s-tr))}
.f-body .bg{font-size:calc(19px*var(--s-bg))}
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;margin:30px 0 4px}
.tap{width:132px;height:132px;border-radius:50%;border:2px solid var(--deep);background:var(--sheet);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
.tap svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);transform:rotate(-90deg)}
.tap circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .15s}
.tap b{font:600 34px/1 var(--sans);color:var(--ink)}
.tap span{font-size:13px;color:var(--muted);margin-top:4px}
.tap.done{background:var(--deep);border-color:var(--deep)}
.tap.done b,.tap.done span{color:var(--paper)}
.tap:active{transform:scale(.97)}
.counter .hint{font:400 13px var(--sans);color:var(--muted);text-align:center}
.counter .reset{border:0;background:none;color:var(--muted);font:400 14px var(--sans);text-decoration:underline;cursor:pointer}
.f-nav{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;padding:10px 16px 14px}
.f-nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font:500 16px var(--sans);cursor:pointer}
.f-nav .next{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.f-nav button:disabled{opacity:.4;cursor:default}

@media (max-width:520px){
  body{font-size:17px}
  .item{grid-template-columns:30px 1fr;gap:4px 10px}
  .hero{padding-top:36px}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зикирь">
<style id="zk-nav">.bar-in .bar-title{display:none}.zk-home{flex:0 1 auto;min-width:0;max-width:min(52vw,340px);display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}.zk-home span{overflow:hidden;text-overflow:ellipsis}.zk-home svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.zk-home:hover,.zk-flag:hover{border-color:var(--gold)}.zk-flag{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet)}.zk-flag svg{width:24px;height:16px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}.bar-in .sel{flex:1 1 0;min-width:0}@media (max-width:479px){.bar-in .sel{max-width:none;min-width:84px}.zk-home{max-width:40vw}}.zk-alt{color:var(--ink)}.zk-alt svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;box-shadow:none;border-radius:0}.zk-ver{display:grid;justify-items:center;gap:8px;margin:22px auto 0;font-family:var(--sans)}.zk-ver small{font-size:13px;color:var(--muted);letter-spacing:.04em}.zk-seg{display:inline-flex;border:1px solid var(--deep);border-radius:999px;overflow:hidden}.zk-seg a,.zk-seg span{padding:8px 16px;font-size:15px;font-weight:500;text-decoration:none;color:var(--deep)}.zk-seg span{background:var(--deep);color:var(--paper)}.zk-seg a:hover{background:color-mix(in srgb,var(--deep) 12%,transparent)}.zk-ver p{margin:0;font-size:14px;color:var(--muted);max-width:40ch;text-align:center}</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="zk-home" id="zkHome" href="index.html" title="Зикирь – начална страница"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg><span>Зикирь</span></a>
    <a class="bar-title" href="#top">Рамазанската дюа</a>
    <select class="sel" id="jump" aria-label="Отиди на"></select>
    <button class="ib" id="focusBtn" aria-label="Четене име по име" title="Име по име">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 12h6M13 9.5 15.5 12 13 14.5"/></svg>
    </button>
    <button class="ib" id="setBtn" aria-label="Настройки" aria-expanded="false" title="Настройки">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<div class="panel" id="panel" role="dialog" aria-label="Настройки">
  <div class="grp">
    <h3>Показвай</h3>
    <label class="tog">Арабски текст <input type="checkbox" data-opt="ar" checked></label>
    <label class="tog">Транскрипция <input type="checkbox" data-opt="tr" checked></label>
    <label class="tog">Превод <input type="checkbox" data-opt="bg" checked></label>
    <label class="tog"><span>Пояснения в скоби<small>Допълнителните преводи и тълкуванията</small></span> <input type="checkbox" data-opt="x" checked></label>
    <label class="tog"><span>Брояч на повторенията<small>В режим „име по име“</small></span> <input type="checkbox" data-opt="cnt" checked></label>
  </div>
  <div class="grp">
    <h3>Размер на шрифта</h3>
    <div class="step" data-k="ar">Арабски текст <span class="ctl"><button data-d="-1" aria-label="По-малък арабски текст">−</button><output></output><button data-d="1" aria-label="По-голям арабски текст">+</button></span></div>
    <div class="step" data-k="tr">Транскрипция <span class="ctl"><button data-d="-1" aria-label="По-малка транскрипция">−</button><output></output><button data-d="1" aria-label="По-голяма транскрипция">+</button></span></div>
    <div class="step" data-k="bg">Превод <span class="ctl"><button data-d="-1" aria-label="По-малък превод">−</button><output></output><button data-d="1" aria-label="По-голям превод">+</button></span></div>
  </div>
  <div class="grp">
    <h3>Тема</h3>
    <div class="seg" id="themeSeg">
      <button data-t="auto" aria-pressed="true">Авто</button>
      <button data-t="light" aria-pressed="false">Светла</button>
      <button data-t="dark" aria-pressed="false">Тъмна</button>
    </div>
  </div>
</div>

<section class="hero" id="top">
  <div class="cal" id="cal" role="img" aria-label="Дуа‘у Рамада̄ни ш-шерӣф"></div>
  <h1>Молитвата за свещения Рамазан</h1>
  <p class="sub">78-те имена на Аллах с айетите към тях: оригиналният арабски текст, транскрипция и превод на български език</p>
  <div class="cta">
    <a class="btn" href="#dua">Започни дюата</a>
    <button class="btn ghost" id="resumeBtn" hidden></button>
  </div>
  <div class="contents">
    <h2>Съдържание</h2>
    <ul class="toc" id="toc"></ul>
    <h2>Имената</h2>
    <div class="grid" id="grid"></div>
  </div>
</section>

<main id="reader"></main>

<div class="focus" id="focus" role="dialog" aria-label="Име по име">
  <div class="f-top">
    <span class="where" id="fWhere"></span>
    <button class="ib" id="fClose" aria-label="Затвори"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="prog"><i id="fProg"></i></div>
  <div class="f-body" id="fBody"></div>
  <div class="f-nav">
    <button id="fPrev">Назад</button>
    <button id="fNext" class="next">Напред</button>

 Ти, който няма еднакъв, нито подобен, нито на земята, нито на небето и който е Всечуващ и Всевиждащ! И няма сила (за спасяване от зло), нито сила (за направа на добро), осен чрез (сила от) Аллах, Височайшия, Великия! И нека Аллах да благослови (и да пожелае доброто на) нашия предводител Мухаммед и на неговото най-добро и най-пречистено семейство! (Молим за това) чрез твойта милост, ей, Най-милостив от всички милостиви! И слава на Аллах, Господар на всички светове!", "tr": "Йа̄ мел лейсе лехӯ мис̱люў ўеля̄ шебӣхун фиљ ер̣д̣и ўеля̄ фис сема̄’и ўе хуўес семӣ‘уљ ‘алӣм. Ўеля̄ х̱аўле ўеля̄ к̣уўўете илля̄ билля̄хиљ ‘алиййиљ ‘аз̣ӣм. Ўе с̣аллел̣ л̣о̄ху ‘аля̄ сеййидиня̄ мух̱аммедиў ўе а̄лихит̣ т̣аййибӣнет̣ т̣о̄хирӣн. Бир̣ах̱метике йа̄ ер̣х̱амер̣ р̣о̄х̱имӣн. Ўељ х̱амду лилля̄хи р̣аббиљ ‘а̄лемӣн."}], "intro": [{"t": "h", "h": "Предава се следната случка:"}, {"t": "p", "h": "Един ден, докато уважаемият Пратеник на Аллах (хазрети Расулюллах) <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صَلَّى ٱللَّٰهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ<\/span> беше облегнат на своята молитвена ниша-михраб, (небесният вестител) Джебраил <span class=\"hon\" lang=\"ar\" dir=\"rtl\">عَلَيْهِ ٱلسَّلَامُ<\/span> влезе при него и го поздрави, като му даде селям. Той заяви: „<i>Ей, Мухаммед, Всевишният ти праща поздрав-селям и ти праща тази молитва-дюа, като подарък за теб и твоя народ<\/i>-<i>уммет. И Той (Всевишният) заяви: „<b><i>Аз Великият (Азимушшан) написах тази молитва-дюа вдясно от Великия ми <\/i> <i>престол (Арш-и Еазам) петстотин години преди създаването на света.<\/i><\/b>“ И който чете тази молитва-дюа, било то в началната, в средната или в крайната нощ (преди петъчния ден) от месец Рамазан, с определено намерение-нийет (каквото сам си е пожелал), Всевишният Аллах <\/i> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">ﷻ<\/span> <i> му отговаря: „<b><i>Този човек е мой истински слуга. И каквато и нужда да има този <\/i> <i>мой слуга, Аз ще му я изпълня!<\/i><\/b>“ Също така този човек ще достигне (и ще успее да намери) свещената нощ Кадр. <\/i>"}, {"t": "p", "h": "<i>И от берекета и благодатта на тази молитва-дюа е че Всевишният Аллах <\/i> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">ﷻ<\/span> <i> създава седемдесет хиляди ангели<\/i>-<i>меляикета в небесата и седемдесет хиляди меляикета на земята. Всяко едно от тези меляикета има седемдесет глави, и всяка глава има двадесет усти, и всяка уста има двадесет езици, и всички тези езици произнасят непрестанно всякакъв вид слова на възхвала-тесбих (като „субханеллах“) и единобожие-техлил (като „ля иляхе иллеллах“), а наградата от това (тези меляикета) я даряват на четящия тази молитва-дюа, или на заръчалия да се прочете, или на заръчалия да се запише, или на носещия я записана в себе си (като талисман). <\/i>"}, {"t": "p", "h": "<i>И още: всеки, който чете, или заръча да се прочете, или слуша, или носи в себе си записана тази молитва-дюа всяка петъчна нощ или всеки петъчен ден от месец Рамазан, Всевишният Аллах <\/i> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">ﷻ<\/span> <i> заявява: „<b><i>Този мой слуга каквато и нужда да <\/i> <i>има, Аз ще му я изпълня.<\/i><\/b>“ <\/i>"}, {"t": "p", "h": "<i>И още, ей, Мухаммед, когато всички творения се изправят от гробовете голи, на тези които са чели тази молитва<\/i>-<i>дюа от уважение-теазим към почтения месец Рамазан-и Шериф, ангелите-меляикета ще им донесат дрехи от Рая-Дженнет и ще ги облекат в тях. И също така седемдесет хиляди меляикета ще донесат в ръцете си сребърни съдове, съдържащи най<\/i>-<i>различни питиета, захлупени с печати, върху които е изписано „ля иляхе иллеллах мухаммедур-расюлюллах“ (Няма бог, освен Аллах. Мухаммед е пратеникът на Аллах). Меляикетата ще извикат: „Това е божествен подарък и „бакшиш“ от Аллах за еди кого си, син на еди кого си, който от уважение към свещения месец Рамазан всеки ден, или всеки петъчен ден, или всяка петъчна нощ (от годината) четеше тази молитва-дюа, или пък караше да я четат, или пък я слушаше, или пък я носеше написана. Всички тези блага-ниамети Всевишният (Хак Теаля) ги изпраща на този човек.“<\/i>“"}, {"t": "p", "h": "И още: уважаемият ни Пророк (хазрети Пейгамбер) <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صَلَّى ٱللَّٰهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ<\/span> заявява: „<i>Което и творение от моите народи-уммети прочете десет пъти тази молитва-дюа в почтения месец Рамазан, то Раят-Дженнет на момента му става съдба-насиб. Дори през целия си живот да не са я чели изобщо, поне един път да я прочетат. И също така Всевишният (Хак Теаля) създава седемдесет хиляди ангели-меляикета, като всички те произнасят слова на възхвала-тесбих и единобожие-техлил, а наградата-севаб (от това) я даряват на онези, които четат с уважение-теазим тази молитва-дюа.<\/i>“"}, {"t": "p", "h": "И така с позволението на Всевишния Господар (Меўля) четящите тази молитва-дюа непременно ще влязат в Рая-Дженнет. И няма съмнение в берекета и благодатта на тази молитва-дюа и в нейните многобройни превъзходства-фазилет, но това тук е само едно кратко изложение (неспособно да ги обхване всички). И Аллах знае най-добре кое е правилно! С това краткото разяснение-шерх на Рамазанската молитва-дюа завърши."}, {"t": "h", "h": "И още:"}, {"t": "p", "h": "Предава се, че най-превъзходното време в годината да се изпее Рамазанската дюа е последната петъчна нощ от месец Рамазан, а най-превъзходният начин да се изпее тази дюа е всяко име на Аллах, с което започва всеки ред, да се повтори толкова пъти, колкото е числото, стоящо след него. Но по което и време да се изпее дюата и по какъвто и да било начин, дори и без повторения, дори и не цялата дюа, а само част от нея, то Всевишният Аллах ще награди богато този човек, стига да е направено от сърце."}, {"t": "h", "h": "И още:"}, {"t": "p", "h": "Когато човек усети, че е привлечен, притеглен, възхитен или очарован от дадено име от споменатите имена, нека да го повтаря често, да размишлява над смисъла му и да почувства въздействието му в своя живот, та да може силата на това име да изпълни изцяло неговата душа и връзката му с Аллах да укрепне още повече чрез това."}], "morph": [{"t": "p", "h": "Най-използваните морфологични форми в тази дюа са следните пет: 1) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَاعِل<\/span>; 2) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعِيل<\/span>; 3) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعَّال<\/span>; 4) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعْلَان<\/span>; 5) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعُول<\/span>."}, {"t": "p", "h": "<b>Първата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, под формата на активно деепричастие, без допълнителни оттенъци в смисъла. Например: №27 „Съживяващ“, №58 „Прощаващ“, №61 „Пребъдващ“ и т.н. Имената по тази форма са следните:"}, {"t": "chips", "items": [["مَالِك", 4], ["خَالِق", 10], ["ظَاهِر", 16], ["بَاطِن", 16], ["قَائِم", 17], ["قَادِر", 25], ["بَاعِث", 27], ["وَارِث", 29], ["كَافٍ", 39], ["شَاكِر", 43], ["غَافِر", 58], ["بَاقٍ", 61], ["هَادٍ", 65], ["عَالِم", 68], ["قَاضٍ", 72], ["وَاسِع", 75], ["قَاهِر", 76], ["غَافِر", 77], ["طَاهِر", 78]]}, {"t": "p", "h": "<b>Втората форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, превърнато в навик, в дълбоко установено качество, прераснало във вродена природа на неговия носител, черта, която се е сляла с неговата същност. Всички имена по тази форма са преведени с добавката „<i>по същината си<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>по същността си<\/i>“, „<i>по природата си<\/i>“, „<i>сам по себе си<\/i>“ и подобните на тях. Например име №3 „Милостив по същината си“ може да бъде прочетено още и като „Милостив по същността си“, „Милостив по природата си“, „Милостив сам по Себе си“ и подобните на тях. Имената по тази форма са следните:"}, {"t": "chips", "items": [["رَحِيم", 3], ["عَزِيز", 9], ["سَمِيع", 19], ["بَصِير", 20], ["حَلِيم", 21], ["عَظِيم", 22], ["حَكِيم", 23], ["كَرِيم", 24], ["قَوِيّ", 30], ["شَهِيد", 31], ["جَلِيل", 36], ["جَمِيل", 37], ["وَكِيل", 38], ["وَلِيّ", 40], ["غَنِيّ", 42], ["رَفِيع", 51], ["شَفِيع", 52], ["كَبِير", 53], ["حَمِيد", 59], ["مَتِين", 64], ["بَدِيع", 66], ["عَلِيم", 67], ["حَسِيب", 73], ["نَصِير", 74]]}, {"t": "p", "h": "Друго нещо, характерно за тази форма е, че тя може да носи смисъла на активно деятелно причастие, на пасивно страдателно причастие или на двете едновременно. Кой от трите случая важи на практика, се определя от езиковата традиция. От езикова гледна точка всички имена на Аллах по тази форма, споменати в настоящата дюа, носят смисъла единствено на активното деятелно причастие. Но от гледна точка на метафизиката на шейх Мухйиддин ибн Араби <span class=\"hon\" lang=\"ar\" dir=\"rtl\">قُدِّسَ سِرُّهُ<\/span> , според която не съществува нищо на този свят, освен Аллах, неговите имена, неговите качества, неговите действия и неговите проявления, то Аллах е едновременно и извършителят и приемникът на действието. Следователно всяко едно от тези имена може да бъде прочетено едновременно в активната му и пасивна форма. Например име №3 може да бъде прочетено като „Милостив и помилван“, №9 – като „Ценящ и ценен“, №19 – като „Чуващ и чут“ и т.н."}, {"t": "p", "h": "<b>Третата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, повторено многократно. При хората, често това обозначава професия. Всички имена по тази форма са преведени с добавката „<i>безбройно много пъти<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>много пъти<\/i>“, „<i>многократно<\/i>“, „<i>неизброимо<\/i>“, „<i>отново и отново<\/i>“, „<i>едно след друго<\/i>“ и подобните на тях. Например име №28 „Даряващ прехраната безбройно много пъти“ може да бъде прочетено още и като „Даряващ прехраната много пъти“, „Даряващ прехраната многократно“, „Даряващ прехраната неизброимо“, „Даряващ прехраната отново и отново“, „Даряващ прехраната едно след друго“ и подобните на тях. Имената по тази форма са следните:"}, {"t": "chips", "items": [["رَزَّاق", 28], ["تَوَّاب", 34], ["وَهَّاب", 35], ["خَلَّاق", 44], ["غَفَّار", 57], ["مَنَّان", 60], ["فَتَّاح", 69], ["جَبَّار", 8]]}, {"t": "p", "h": "<b>Четвъртата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, изпълнено до съвършенство, получило всеобхватност, без да остави нищо недокоснато от него. Всички имена по тази форма са преведени с добавката „<i>всеобхватно<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>напълно<\/i>“, „<i>изцяло<\/i>“ и подобните на тях. Например име №2 „Всеобхватно милостивият“ може да бъде прочетено още и като „Напълно милостивият“, „Изцяло милостивият“ и подобните на тях. Имената по тази форма са следните:"}, {"t": "chips", "items": [["رَحْمٰن", 2], ["مَنَّان", 60], ["غُفْرَان", 77]]}, {"t": "p", "h": "<b>Петата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, придобило постоянство и стабилност. Всички имена по тази форма са преведени с добавката „<i>винаги<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>постоянно<\/i>“, „<i>непрестанно<\/i>“, „<i>неизменно<\/i>“ и подобните на тях. Например име №13 „Винаги благодарен“ може да бъде прочетено още и като „Постоянно благодарен“, „Непрестанно благодарен“, „Неизменно благодарен“ и подобните на тях. Имената по тази форма са следните:"}, {"t": "chips", "items": [["شَكُور", 13], ["غَفُور", 14], ["وَدُود", 15]]}, {"t": "p", "h": "Въпреки това, трябва да се има предвид, че значенията, които тези морфологични форми носят не са закон, без изключения, а по-скоро обща закономерност, която да служи за ориентир на читателя. А точното значение на думата може да се определи със сигурност единствено от езиковата традиция на арабите от времето на Пратеника на Аллах <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صَلَّى ٱللَّٰهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ<\/span> ."}, {"t": "p", "h": "Освен основния превод, за всяко от имената са посочени няколко допълнителни превода в скобите след него. Уважаемият читател е окуражен да избере този превод, който чувства най-въздействащ, а после според морфологичната му форма да го съчетае с най-въздействащата върху сърцето му добавка. Например име №14 „Винаги прощаващ“ може да бъде прочетено още и като „Винаги извиняващ“, „Винаги прикриващ“ и „Винаги предпазващ“. Морфологичните добавки от тази форма от своя страна могат да бъдат прочетени като „Постоянно прощаващ“, „Непрестанно прощаващ“, „Неизменно прощаващ“. И от съчетаването на различните преводи с различните морфологични добавки се получават различните възможни варианти: „Постоянно извиняващ“, „Непрестанно извиняващ“, „Неизменно извиняващ“, „Постоянно прикриващ“, „Непрестанно прикриващ“, „Неизменно прикриващ“, „Постоянно предпазващ“, „Непрестанно предпазващ“, „Неизменно предпазващ“ и подобните на тях. Та така от пеенето на дюата да има най-голяма полза и връзката с Аллах да бъде почувствана най-силно."}, {"t": "p", "h": "По същия начин към превода на айетите, цитирани след имената на Аллах, е добавено кратко пояснение на смисъла, поместено в скоби, с по-дребен шрифт. Това пояснение е тълкуване, което не е част от оригиналния текст на айетите."}], "corrIntro": "Рамазанската дюа се състои от 78 имена на Аллах, след всяко от които е поместен айета, от който съответното име е извлечено. На няколко места в ръкописите на дюата има разминавания, които са редактирани в настоящата разпечатка. На следващата страница са дадени местата с разминаване, според поместеното в ръкописите.", "corr": [{"tr": "Йа̄ муте‘а̄љ (6) Фете‘а̄лел̣ л̣о̄хуљ меликуљ х̱ак̣к̣уљ мубӣн.", "ar": {"w": 755, "h": 90, "b64": "iVBORw0KGgoAAAANSUhEUgAAAvMAAABaBAMAAADHp8TrAAAAMFBMVEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABaPxwLAAAAEHRSTlMAESIzRFVmd4iZqrvM3e7/dpUBFQAAFS9JREFUeNrtXHl0W9WZ/70nWba8RWGyANkepUwzkMSCMpADMVbpQGEgsYBOOVMWuzBhDzYMpYUh2GzlQDPYQCktkLEHOsBAwKYty6FJ5EJLMwmJEhKWJAS50OyLHJLYsS3pmz/uve/dt0pew+Ho/mVL937fd3/329/VA/IjP/IjP/I <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const items=D.items;
const AR_K=0.42, AR_FK=0.56;
const plain=h=>{const t=document.createElement('div');t.innerHTML=h;t.querySelectorAll('.x').forEach(e=>e.remove());return t.textContent.replace(/\s+/g,' ').replace(/\s+([!,.])/g,'$1').trim();};

/* storage: works where available, silently in memory elsewhere */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem('rdua:'+k);if(v!=null)return JSON.parse(v);}catch(e){} return mem[k];},
  set(k,v){mem[k]=v;try{localStorage.setItem('rdua:'+k,JSON.stringify(v));}catch(e){}}
};

function arEl(a,k,label){
  const d=document.createElement('div');
  d.className='arimg';d.setAttribute('role','img');if(label)d.setAttribute('aria-label',label);
  const u='url(data:image/png;base64,'+a.b64+')';
  d.style.webkitMaskImage=u;d.style.maskImage=u;
  d.style.aspectRatio=a.w+' / '+a.h;
  d.style.width='calc('+(a.w*k).toFixed(1)+'px * var(--s-ar))';
  return d;
}
function label(it){
  if(it.kind==='open') return it===items[0]?'Бисмиллях':'Аллахумме';
  if(it.kind==='close') return 'Заключение';
  return it.nums.join('–')+'. '+it.names.map(plain).map(s=>s.replace(/!$/,'')).join(', ');
}
function idOf(i){const it=items[i];return it.kind==='name'?'n'+it.nums[0]:it.kind==='close'?'n-end':'n-o'+i;}
function trHtml(it){
  if(it.kind!=='name') return esc(it.tr);
  return it.trNames.map((n,j)=>'Йа̄ '+esc(n)+' <span class="y">('+it.nums[j]+')</span>').join(' ')+' '+esc(it.trAyah);
}
function bgHtml(it){
  if(it.kind!=='name') return it.bg;
  return it.names.map(n=>'<span class="nm">Ей, '+n.trim()+'</span>').join(' ')+'<span class="ay">'+it.ayah+'</span>';
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- build reader ---------- */
const R=$('#reader');
function sec(id,title,lede){const s=document.createElement('section');s.className='sec';s.id=id;s.innerHTML='<h2>'+title+'</h2>'+(lede?'<p class="lede">'+lede+'</p>':'');R.appendChild(s);return s;}

const sIntro=sec('intro','За дюата');
const pi=document.createElement('div');pi.className='prose';
D.intro.forEach(p=>{pi.insertAdjacentHTML('beforeend',p.t==='h'?'<h3>'+p.h+'</h3>':'<p>'+p.h+'</p>');});
sIntro.appendChild(pi);

const sDua=sec('dua','Рамазанската дюа','Числото след всяко име показва колко пъти е най-добре то да се повтори.');
items.forEach((it,i)=>{
  const a=document.createElement('article');
  a.className='item'+(it.kind==='name'?'':' plain');a.id=idOf(i);a.dataset.i=i;
  a.innerHTML='<div class="num">'+(it.kind==='name'?'<a href="#'+idOf(i)+'">'+it.nums.join('<br>')+'</a>':'')+'</div><div class="body"><div class="ar"></div><p class="tr">'+trHtml(it)+'</p><p class="bg">'+bgHtml(it)+'</p></div>';
  a.querySelector('.ar').appendChild(arEl(it.ar,AR_K,it.kind==='name'?('Йа̄ '+it.trNames.join(', Йа̄ ')):it.tr));
  sDua.appendChild(a);
});

const sLet=sec('letters','Транскрипция на буквите','Удължените букви са отбелязани с чертичка над тях, а удебелените – с точка под тях.');
const L=[['ء','а'],['ب','б'],['ت','т'],['ث','с̱'],['ج','ж̱'],['ح','х̱'],['خ','х̣'],['د','д'],['ذ','з̱'],['ر','р <small>или</small> р̣'],['ز','з'],['س','с'],['ش','ш'],['ص','с̣'],['ض','д̣'],['ط','т̣'],['ظ','з̣'],['ع','‘ <small>или</small> а‘'],['غ','г̣'],['ف','ф'],['ق','к̣'],['ك','к'],['ل','л <small>или</small> љ <small>или</small> л̣'],['م','м'],['ن','н'],['هـ','х'],['و','ў'],['ى','й']];
sLet.insertAdjacentHTML('beforeend','<div class="lede" style="margin:0">Съгласни [Х̱ур̣ӯф]</div><div class="letters">'+L.map(x=>'<div class="lt"><span class="c">'+x[1]+'</span><span class="a" lang="ar">'+x[0]+'</span></div>').join('')+'</div>'+
 '<table class="vow"><tr><th colspan="2">Кратки гласни [Х̱ар̣акя̄т]</th></tr><tr><td>у или ю</td><td>д̣амме</td></tr><tr><td>и</td><td>кесра</td></tr><tr><td>а или е</td><td>фетх̱а</td></tr>'+
 '<tr><th colspan="2">Дълги гласни [Х̱ур̣ӯф ељ-медд]</th></tr><tr><td>ӯ или ю̄</td><td>ўа̄ў</td></tr><tr><td>ӣ</td><td>йа̄</td></tr><tr><td>а̄ или о̄ или я̄</td><td>елиф</td></tr></table>');

const sMor=sec('forms','Морфологичните форми на имената');
const pm=document.createElement('div');pm.className='prose';
D.morph.forEach(p=>{
  if(p.t==='chips'){pm.insertAdjacentHTML('beforeend','<div class="chips">'+p.items.map(c=>'<a href="#n'+(c[1]===33?32:c[1])+'"><span lang="ar">'+c[0]+'</span><b>'+c[1]+'</b></a>').join('')+'</div>');}
  else pm.insertAdjacentHTML('beforeend','<p>'+p.h+'</p>');
});
sMor.appendChild(pm);

const sCor=sec('fixes','Корекции в ръкописа');
sCor.insertAdjacentHTML('beforeend','<div class="prose"><p>'+D.corrIntro+'</p></div>');
const cw=document.createElement('div');cw.className='corr';
D.corr.forEach(c=>{const d=document.createElement('div');d.appendChild(arEl(c.ar,AR_K,c.tr));d.insertAdjacentHTML('beforeend','<p>'+esc(c.tr)+'</p>');cw.appendChild(d);});
sCor.appendChild(cw);

/* hero */
const h=D.hero, cal=$('#cal');const u='url(data:image/png;base64,'+h.b64+')';
cal.style.cssText+='background:var(--ink);-webkit-mask:'+u+' center/contain no-repeat;mask:'+u+' center/contain no-repeat;aspect-ratio:'+h.w+'/'+h.h;

/* toc, grid, jump */
const toc=[['intro','За дюата','Предание и наставления'],['dua','Рамазанската дюа','78 имена'],['letters','Транскрипция на буквите',''],['forms','Морфологичните форми','5 форми'],['fixes','Корекции в ръкописа',D.corr.length+' места']];
$('#toc').innerHTML=toc.map(t=>'<li><a href="#'+t[0]+'">'+t[1]+'<span>'+t[2]+'</span></a></li>').join('');
const grid=$('#grid');
items.forEach((it,i)=>{if(it.kind!=='name')return;grid.insertAdjacentHTML('beforeend','<a href="#'+idOf(i)+'" data-i="'+i+'" title="'+esc(label(it))+'">'+it.nums.join('–')+'</a>');});
const J=$('#jump');
let opts='<option value="top">Начало</option><option value="intro">За дюата</option><optgroup label="Дюата">';
items.forEach((it,i)=>{opts+='<option value="'+idOf(i)+'">'+esc(label(it))+'</option>';});
opts+='</optgroup><optgroup label="Приложения"><option value="letters">Транскрипция на буквите</option><option value="forms">Морфологичните форми</option><option value="fixes">Корекции в ръкописа</option></optgroup>';
J.innerHTML=opts;
J.addEventListener('change',()=>{const el=document.getElementById(J.value);if(el)el.scrollIntoView();});

/* ---------- settings ---------- */
const panel=$('#panel'),setBtn=$('#setBtn');
setBtn.onclick=e=>{e.stopPropagation();const o=panel.classList.toggle('open');setBtn.setAttribute('aria-expanded',o);};
document.addEventListener('click',e=>{if(panel.classList.contains('open')&&!panel.contains(e.target)&&e.target!==setBtn){panel.classList.remove('open');setBtn.setAttribute('aria-expanded',false);}});
const opt=Object.assign({ar:true,tr:true,bg:true,x:true,cnt:true},store.get('opt')||{});
function applyOpt(){
  document.body.classList.toggle('noar',!opt.ar);document.body.classList.toggle('notr',!opt.tr);
  document.body.classList.toggle('nobg',!opt.bg);document.body.classList.toggle('nox',!opt.x);
}
document.querySelectorAll('[data-opt]').forEach(c=>{c.checked=opt[c.dataset.opt];c.onchange=()=>{opt[c.dataset.opt]=c.checked;store.set('opt',opt);applyOpt();if(F.open)renderF();};});
applyOpt();
const sz=Object.assign({ar:0,tr:0,bg:0},store.get('sz')||{});
function applySz(){
  document.querySelectorAll('.step').forEach(s=>{const k=s.dataset.k;const f=Math.round((1+sz[k]*0.1)*100);s.querySelector('output').textContent=f+'%';document.documentElement.style.setProperty('--s-'+k,(1+sz[k]*0.1).toFixed(2));});
}
document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const k=b.closest('.step').dataset.k;sz[k]=Math.max(-4,Math.min(8,sz[k]+ +b.dataset.d));store.set('sz',sz);applySz();});
applySz();
let theme=store.get('theme')||'auto';
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===theme));}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{theme=b.dataset.t;store.set('theme',theme);applyTheme();});
applyTheme();

/* ---------- position memory ---------- */
let curI=-1;
const arts=[...document.querySelectorAll('.item')];
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){const i=+e.target.dataset.i;setCur(i,false);}});
},{rootMargin:'-30% 0px -60% 0px'});
arts.forEach(a=>io.observe(a));
const io2=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&document.activeElement!==J)J.value=e.target.parentElement.id;});},{rootMargin:'-20% 0px -70% 0px'});
['intro','letters','forms','fixes'].forEach(id=>io2.observe(document.querySelector('#'+id+'>h2')));
function setCur(i,mark){
  curI=i;store.set('pos',i);
  grid.querySelectorAll('a.cur').forEach(a=>a.classList.remove('cur'));
  const g=grid.querySelector('a[data-i="'+i+'"]');if(g)g.classList.add('cur');
  if(J.value!==idOf(i)&&document.activeElement!==J){J.value=idOf(i);}
  if(mark){arts.forEach(a=>a.classList.toggle('cur',+a.dataset.i===i));}
}
const saved=store.get('pos');
const rb=$('#resumeBtn');
if(typeof saved==='number'&&saved>1){rb.hidden=false;rb.textContent='Продължи от '+(items[saved].kind==='name'?'№'+items[saved].nums.join('–'):'заключението');rb.onclick=()=>document.getElementById(idOf(saved)).scrollIntoView();}

/* ---------- focus mode ---------- */
const F={open:false,i:0,c:{}};
const fb=$('#fBody');
function targets(it){return it.kind==='name'?it.nums:[];}
function renderF(){
  const it=items[F.i];
  $('#fWhere').textContent=it.kind==='name'?('Име '+it.nums.join('–')+' от 78'):label(it);
  $('#fProg').style.width=((F.i+1)/items.length*100)+'%';
  fb.innerHTML=(it.kind==='name'?'<div class="fnum">№ '+it.nums.join(' и ')+'</div>':'')+'<div class="ar"></div><p class="tr">'+trHtml(it)+'</p><p class="bg">'+bgHtml(it)+'</p>';
  fb.querySelector('.ar').appendChild(arEl(it.ar,AR_FK,null));
  const T=targets(it);
  if(opt.cnt&&T.length){
    const st=F.c[F.i]||(F.c[F.i]={k:0,n:0});
    const tgt=T[st.k];const done=st.k===T.length-1&&st.n>=tgt;
    const C=2*Math.PI*64;const frac=Math.min(1,st.n/tgt);
    const name=it.trNames[st.k];
    fb.insertAdjacentHTML('beforeend','<div class="counter"><button class="tap'+(done?' done':'')+'" id="tap" aria-label="Броене: '+st.n+' от '+tgt+'"><svg viewBox="0 0 136 136"><circle cx="68" cy="68" r="64" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'"/></svg><b>'+st.n+'</b><span>от '+tgt+'</span></button><div class="hint">'+(done?'Готово':(T.length>1?'Йа̄ '+esc(name)+' · ':'')+'Докоснете при всяко повторение')+'</div>'+(st.n||st.k?'<button class="reset" id="reset">Започни отначало</button>':'')+'</div>');
    $('#tap').onclick=()=>{
      if(st.n>=tgt){if(st.k<T.length-1){st.k++;st.n=0;}else return;}
      st.n++;
      if(st.n>=tgt&&navigator.vibrate)try{navigator.vibrate(st.k===T.length-1?[40,60,40]:30);}catch(e){}
      renderF();
    };
    const r=$('#reset');if(r)r.onclick=()=>{F.c[F.i]={k:0,n:0};renderF();};
  }
  $('#fPrev').disabled=F.i===0;
  $('#fNext').textContent=F.i===items.length-1?'Край':'Напред';
  fb.scrollTop=0;
  setCur(F.i,false);
}
function openF(i){F.open=true;F.i=Math.max(0,i);$('#focus').classList.add('open');document.body.style.overflow='hidden';renderF();}
function closeF(){F.open=false;$('#focus').classList.remove('open');document.body.style.overflow='';const el=document.getElementById(idOf(F.i));if(el){el.scrollIntoView({block:'center'});setCur(F.i,true);}}
$('#focusBtn').onclick=()=>openF(curI>=0?curI:0);
$('#fClose').onclick=closeF;
$('#fPrev').onclick=()=>{if(F.i>0){F.i--;renderF();}};
$('#fNext').onclick=()=>{if(F.i<items.length-1){F.i++;renderF();}else closeF();};
document.addEventListener('keydown',e=>{
  if(!F.open)return;
  if(e.key==='Escape')closeF();
  else if(e.key==='ArrowRight'||e.key==='PageDown')$('#fNext').click();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')$('#fPrev').click();
  else if(e.key===' '&&$('#tap')){e.preventDefault();$('#tap').click();}
});
let tx=null;
fb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
fb.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70){dx<0?$('#fNext').click():$('#fPrev').click();}});
})();
</script>
<script id="zk-nav-js">
(function(){
  var a=document.getElementById('zkHome'), hero=document.getElementById('top');
  if(!a||!hero) return;
  var t=document.querySelector('.bar-title'), name=(t&&t.textContent.trim())||document.title;
  var lab=a.querySelector('span'), ic=a.querySelector('svg');
  var HOME=ic.innerHTML, BOOK='<path d="M5 5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0-2 2z"/><path d="M5 19a2 2 0 0 0 2 2h12v-4"/>';
  function set(atStart){
    if(atStart){a.href='index.html';lab.textContent='Зикирь';ic.innerHTML=HOME;a.title='Зикирь – начална страница';}
    else{a.href='#top';lab.textContent=name;ic.innerHTML=BOOK;a.title=name+' – към началото';}
  }
  function check(){var r=hero.getBoundingClientRect();set(r.bottom>80);}
  check();
  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check);
  window.addEventListener('hashchange',function(){setTimeout(check,50);});
})();
</script>
