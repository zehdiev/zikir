<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рамазанската дюа</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F4F6F2; --sheet:#FFFFFF; --ink:#18211F; --muted:#5D6966; --deep:#1D5B53; --gold:#9A7428; --rule:#DCE2DD; --wash:#E9EFEA;
  --s-ar:1.2; --s-tr:1; --s-bg:1;
  --serif:"Literata", "Noto Serif", Georgia, serif;
  --tr:"Noto Serif", "Literata", Georgia, serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arf:"Amiri", "Traditional Arabic", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1514; --sheet:#141D1C; --ink:#E6ECE7; --muted:#9BAAA5; --deep:#8CC9BC; --gold:#D6B266; --rule:#25312F; --wash:#1A2624; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1514; --sheet:#141D1C; --ink:#E6ECE7; --muted:#9BAAA5; --deep:#8CC9BC; --gold:#D6B266; --rule:#25312F; --wash:#1A2624; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* arabic image rendered as a mask so it follows the theme colour */
.arimg{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:right center;mask-position:right center;max-width:100%;margin-left:auto;color:var(--ink)}
.hon,.arw{unicode-bidi:isolate}
.hon{font-family:var(--arf);font-size:.95em;color:var(--gold);white-space:nowrap}
.arw{font-family:var(--arf);font-size:1.25em;color:var(--deep)}

/* bar */
.bar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--sans)}
.bar-title{font:600 16px var(--sans);color:var(--ink);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{appearance:none;-webkit-appearance:none;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 30px 7px 10px;font:500 15px var(--sans);color:var(--ink);max-width:44vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* settings */
.panel{position:fixed;z-index:30;right:max(12px,calc((100vw - 820px)/2 + 12px));top:calc(env(safe-area-inset-top,0px) + 60px);width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;font-family:var(--sans);box-shadow:0 14px 40px rgba(8,20,18,.2);display:none}
.panel.open{display:block}
.panel h3{margin:0 0 6px;font:500 13px var(--sans);color:var(--muted)}
.grp+.grp{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px;cursor:pointer}
.tog small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.tog input{flex:none;appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--rule);position:relative;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--deep)}
.tog input:checked::after{transform:translateX(18px)}
.step{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:16px}
.ctl{display:inline-flex;align-items:center;gap:4px}
.ctl button{width:34px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:18px;line-height:1}
.ctl output{min-width:44px;text-align:center;font-size:14px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;border:0;background:transparent;cursor:pointer;font-size:15px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--paper)}

/* hero */
.hero{max-width:820px;margin:0 auto;padding:56px 20px 24px;text-align:center}
.hero .cal{margin:0 auto;width:min(560px,92%)}
.hero h1{font:400 clamp(26px,5vw,36px)/1.2 var(--serif);margin:28px 0 8px;letter-spacing:.005em}
.hero p.sub{margin:0 auto;max-width:34em;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:var(--paper);font:500 16px var(--sans);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep)}

.contents{max-width:760px;margin:24px auto 0;padding:0 20px;text-align:left;font-family:var(--sans)}
.contents h2{font:500 14px var(--sans);color:var(--muted);margin:26px 0 8px}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:16px}
.toc a span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid a{display:flex;align-items:center;justify-content:center;height:42px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);text-decoration:none;color:var(--ink);font:500 15px var(--sans)}@media (hover:hover){.grid a:hover{border-color:var(--deep);color:var(--deep)}}
.grid a.cur{background:var(--deep);border-color:var(--deep);color:var(--paper)}

/* reader */
main{max-width:760px;margin:0 auto;padding:0 20px 80px}
.sec{padding-top:44px}
.sec>h2{font:400 clamp(24px,4vw,30px)/1.25 var(--serif);margin:0 0 6px}
.sec>.lede{color:var(--muted);font:400 15px/1.5 var(--sans);margin:0 0 18px}
.prose p{margin:0 0 1em;hyphens:auto;-webkit-hyphens:auto}
.prose h3{font:italic 400 20px var(--serif);color:var(--deep);margin:1.4em 0 .4em}
.prose b{font-weight:600}

.item{position:relative;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:22px 0;border-bottom:1px solid var(--rule)}
.item:first-of-type{border-top:1px solid var(--rule)}
.num{font:600 15px/1 var(--sans);color:var(--gold);padding-top:8px;text-align:left}
.num a{color:inherit;text-decoration:none}
.body{min-width:0}
.item.plain{grid-template-columns:1fr}
.item.plain .num{display:none}
.ar{margin:0 0 12px}
.tr{font-family:var(--tr);font-style:italic;color:var(--deep);font-size:calc(17px*var(--s-tr));line-height:1.55;margin:0 0 8px}
.tr .y{font-style:normal;font-weight:400}
.bg{font-size:calc(17.5px*var(--s-bg));line-height:1.6;margin:0}
.bg .nm{font-weight:600}
.bg .nm .x{font-weight:400}
.bg .ay{display:block;margin-top:4px}
.x{color:var(--muted);font-size:.86em}
body.nox .x{display:none}
body.noar .ar, body.notr .tr, body.nobg .bg{display:none}
.item.cur{background:linear-gradient(90deg,var(--wash),transparent 85%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.rep{font:400 13px var(--sans);color:var(--muted);margin-top:6px}

/* appendices */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:12px 0 18px;direction:rtl}
.lt{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lt .a{font-family:var(--arf);font-size:28px;line-height:1.1}
.lt .c{font-family:var(--tr);font-size:18px;text-align:right}
.lt .c small{color:var(--muted);font-size:12px;font-family:var(--sans)}
.vow{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:16px}
.vow th{font:500 13px var(--sans);color:var(--muted);text-align:left;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.vow td{padding:8px 0;border-bottom:1px solid var(--rule)}
.vow td:first-child{font-family:var(--tr)}
.vow td:last-child{color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 1.2em;direction:rtl}
.chips a{direction:ltr;display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);text-decoration:none;color:var(--ink)}
.chips a b{font:500 12px var(--sans);color:var(--gold)}
.chips a span{font-family:var(--arf);font-size:19px}
.corr{border-top:1px solid var(--rule);margin-top:12px}
.corr div{padding:14px 0;border-bottom:1px solid var(--rule)}
.corr p{margin:6px 0 0;font-family:var(--tr);font-style:italic;color:var(--deep);font-size:16px}

/* focus */
.focus{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.focus.open{display:flex}
.f-top{display:flex;align-items:center;gap:10px;max-width:820px;width:100%;margin:0 auto;padding:10px 16px;font-family:var(--sans)}
.f-top .where{margin-right:auto;font-size:15px;color:var(--muted)}
.prog{height:3px;background:var(--rule);max-width:820px;width:calc(100% - 32px);margin:0 auto;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.f-body{flex:1;overflow:auto;width:100%;max-width:760px;margin:0 auto;padding:28px 20px}
.f-body .fnum{font:600 15px var(--sans);color:var(--gold);margin-bottom:14px}
.f-body .ar{margin-bottom:22px}
.f-body .tr{font-size:calc(19px*var(--s-tr))}
.f-body .bg{font-size:calc(19px*var(--s-bg))}
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;margin:30px 0 4px}
.tap{width:132px;height:132px;border-radius:50%;border:2px solid var(--deep);background:var(--sheet);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
.tap svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);transform:rotate(-90deg)}
.tap circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .15s}
.tap b{font:600 34px/1 var(--sans);color:var(--ink)}
.tap span{font-size:13px;color:var(--muted);margin-top:4px}
.tap.done{background:var(--deep);border-color:var(--deep)}
.tap.done b,.tap.done span{color:var(--paper)}
.tap:active{transform:scale(.97)}
.counter .hint{font:400 13px var(--sans);color:var(--muted);text-align:center}
.counter .reset{border:0;background:none;color:var(--muted);font:400 14px var(--sans);text-decoration:underline;cursor:pointer}
.f-nav{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;padding:10px 16px 14px}
.f-nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font:500 16px var(--sans);cursor:pointer}
.f-nav .next{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.f-nav button:disabled{opacity:.4;cursor:default}

@media (max-width:520px){
  body{font-size:17px}
  .item{grid-template-columns:30px 1fr;gap:4px 10px}
  .hero{padding-top:36px}
}
.zk-flow{display:flex;flex-wrap:wrap;direction:rtl;align-items:flex-end;justify-content:flex-start;column-gap:calc(7px*var(--s-ar));row-gap:0}.zk-flow .arimg{margin-left:0}</style>

љ ‘аз̣ӣм. Ўе с̣аллел̣ л̣о̄ху ‘аля̄ сеййидиня̄ мух̱аммедиў ўе а̄лихит̣ т̣аййибӣнет̣ т̣о̄хирӣн. Бир̣ах̱метике йа̄ ер̣х̱амер̣ р̣о̄х̱имӣн. Ўељ х̱амду лилля̄хи р̣аббиљ ‘а̄лемӣн."}],"intro":[{"t":"h","h":"Предава се следната случка:"},{"t":"p","h":"Един ден, докато уважаемият Пратеник на Аллах (хазрети Расулюллах) <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صَلَّى ٱللَّٰهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ<\/span> беше облегнат на своята молитвена ниша-михраб, (небесният вестител) Джебраил <span class=\"hon\" lang=\"ar\" dir=\"rtl\">عَلَيْهِ ٱلسَّلَامُ<\/span> влезе при него и го поздрави, като му даде селям. Той заяви: „<i>Ей, Мухаммед, Всевишният ти праща поздрав-селям и ти праща тази молитва-дюа, като подарък за теб и твоя народ<\/i>-<i>уммет. И Той (Всевишният) заяви: „<b><i>Аз Великият (Азимушшан) написах тази молитва-дюа вдясно от Великия ми <\/i> <i>престол (Арш-и Еазам) петстотин години преди създаването на света.<\/i><\/b>“ И който чете тази молитва-дюа, било то в началната, в средната или в крайната нощ (преди петъчния ден) от месец Рамазан, с определено намерение-нийет (каквото сам си е пожелал), Всевишният Аллах <\/i> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">ﷻ<\/span> <i> му отговаря: „<b><i>Този човек е мой истински слуга. И каквато и нужда да има този <\/i> <i>мой слуга, Аз ще му я изпълня!<\/i><\/b>“ Също така този човек ще достигне (и ще успее да намери) свещената нощ Кадр. <\/i>"},{"t":"p","h":"<i>И от берекета и благодатта на тази молитва-дюа е че Всевишният Аллах <\/i> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">ﷻ<\/span> <i> създава седемдесет хиляди ангели<\/i>-<i>меляикета в небесата и седемдесет хиляди меляикета на земята. Всяко едно от тези меляикета има седемдесет глави, и всяка глава има двадесет усти, и всяка уста има двадесет езици, и всички тези езици произнасят непрестанно всякакъв вид слова на възхвала-тесбих (като „субханеллах“) и единобожие-техлил (като „ля иляхе иллеллах“), а наградата от това (тези меляикета) я даряват на четящия тази молитва-дюа, или на заръчалия да се прочете, или на заръчалия да се запише, или на носещия я записана в себе си (като талисман). <\/i>"},{"t":"p","h":"<i>И още: всеки, който чете, или заръча да се прочете, или слуша, или носи в себе си записана тази молитва-дюа всяка петъчна нощ или всеки петъчен ден от месец Рамазан, Всевишният Аллах <\/i> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">ﷻ<\/span> <i> заявява: „<b><i>Този мой слуга каквато и нужда да <\/i> <i>има, Аз ще му я изпълня.<\/i><\/b>“ <\/i>"},{"t":"p","h":"<i>И още, ей, Мухаммед, когато всички творения се изправят от гробовете голи, на тези които са чели тази молитва<\/i>-<i>дюа от уважение-теазим към почтения месец Рамазан-и Шериф, ангелите-меляикета ще им донесат дрехи от Рая-Дженнет и ще ги облекат в тях. И също така седемдесет хиляди меляикета ще донесат в ръцете си сребърни съдове, съдържащи най<\/i>-<i>различни питиета, захлупени с печати, върху които е изписано „ля иляхе иллеллах мухаммедур-расюлюллах“ (Няма бог, освен Аллах. Мухаммед е пратеникът на Аллах). Меляикетата ще извикат: „Това е божествен подарък и „бакшиш“ от Аллах за еди кого си, син на еди кого си, който от уважение към свещения месец Рамазан всеки ден, или всеки петъчен ден, или всяка петъчна нощ (от годината) четеше тази молитва-дюа, или пък караше да я четат, или пък я слушаше, или пък я носеше написана. Всички тези блага-ниамети Всевишният (Хак Теаля) ги изпраща на този човек.“<\/i>“"},{"t":"p","h":"И още: уважаемият ни Пророк (хазрети Пейгамбер) <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صَلَّى ٱللَّٰهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ<\/span> заявява: „<i>Което и творение от моите народи-уммети прочете десет пъти тази молитва-дюа в почтения месец Рамазан, то Раят-Дженнет на момента му става съдба-насиб. Дори през целия си живот да не са я чели изобщо, поне един път да я прочетат. И също така Всевишният (Хак Теаля) създава седемдесет хиляди ангели-меляикета, като всички те произнасят слова на възхвала-тесбих и единобожие-техлил, а наградата-севаб (от това) я даряват на онези, които четат с уважение-теазим тази молитва-дюа.<\/i>“"},{"t":"p","h":"И така с позволението на Всевишния Господар (Меўля) четящите тази молитва-дюа непременно ще влязат в Рая-Дженнет. И няма съмнение в берекета и благодатта на тази молитва-дюа и в нейните многобройни превъзходства-фазилет, но това тук е само едно кратко изложение (неспособно да ги обхване всички). И Аллах знае най-добре кое е правилно! С това краткото разяснение-шерх на Рамазанската молитва-дюа завърши."},{"t":"h","h":"И още:"},{"t":"p","h":"Предава се, че най-превъзходното време в годината да се изпее Рамазанската дюа е последната петъчна нощ от месец Рамазан, а най-превъзходният начин да се изпее тази дюа е всяко име на Аллах, с което започва всеки ред, да се повтори толкова пъти, колкото е числото, стоящо след него. Но по което и време да се изпее дюата и по какъвто и да било начин, дори и без повторения, дори и не цялата дюа, а само част от нея, то Всевишният Аллах ще награди богато този човек, стига да е направено от сърце."},{"t":"h","h":"И още:"},{"t":"p","h":"Когато човек усети, че е привлечен, притеглен, възхитен или очарован от дадено име от споменатите имена, нека да го повтаря често, да размишлява над смисъла му и да почувства въздействието му в своя живот, та да може силата на това име да изпълни изцяло неговата душа и връзката му с Аллах да укрепне още повече чрез това."}],"morph":[{"t":"p","h":"Най-използваните морфологични форми в тази дюа са следните пет: 1) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَاعِل<\/span>; 2) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعِيل<\/span>; 3) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعَّال<\/span>; 4) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعْلَان<\/span>; 5) <span class=\"arw\" lang=\"ar\" dir=\"rtl\">فَعُول<\/span>."},{"t":"p","h":"<b>Първата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, под формата на активно деепричастие, без допълнителни оттенъци в смисъла. Например: №27 „Съживяващ“, №58 „Прощаващ“, №61 „Пребъдващ“ и т.н. Имената по тази форма са следните:"},{"t":"chips","items":[["مَالِك",4],["خَالِق",10],["ظَاهِر",16],["بَاطِن",16],["قَائِم",17],["قَادِر",25],["بَاعِث",27],["وَارِث",29],["كَافٍ",39],["شَاكِر",43],["غَافِر",58],["بَاقٍ",61],["هَادٍ",65],["عَالِم",68],["قَاضٍ",72],["وَاسِع",75],["قَاهِر",76],["غَافِر",77],["طَاهِر",78]]},{"t":"p","h":"<b>Втората форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, превърнато в навик, в дълбоко установено качество, прераснало във вродена природа на неговия носител, черта, която се е сляла с неговата същност. Всички имена по тази форма са преведени с добавката „<i>по същината си<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>по същността си<\/i>“, „<i>по природата си<\/i>“, „<i>сам по себе си<\/i>“ и подобните на тях. Например име №3 „Милостив по същината си“ може да бъде прочетено още и като „Милостив по същността си“, „Милостив по природата си“, „Милостив сам по Себе си“ и подобните на тях. Имената по тази форма са следните:"},{"t":"chips","items":[["رَحِيم",3],["عَزِيز",9],["سَمِيع",19],["بَصِير",20],["حَلِيم",21],["عَظِيم",22],["حَكِيم",23],["كَرِيم",24],["قَوِيّ",30],["شَهِيد",31],["جَلِيل",36],["جَمِيل",37],["وَكِيل",38],["وَلِيّ",40],["غَنِيّ",42],["رَفِيع",51],["شَفِيع",52],["كَبِير",53],["حَمِيد",59],["مَتِين",64],["بَدِيع",66],["عَلِيم",67],["حَسِيب",73],["نَصِير",74]]},{"t":"p","h":"Друго нещо, характерно за тази форма е, че тя може да носи смисъла на активно деятелно причастие, на пасивно страдателно причастие или на двете едновременно. Кой от трите случая важи на практика, се определя от езиковата традиция. От езикова гледна точка всички имена на Аллах по тази форма, споменати в настоящата дюа, носят смисъла единствено на активното деятелно причастие. Но от гледна точка на метафизиката на шейх Мухйиддин ибн Араби <span class=\"hon\" lang=\"ar\" dir=\"rtl\">قُدِّسَ سِرُّهُ<\/span> , според която не съществува нищо на този свят, освен Аллах, неговите имена, неговите качества, неговите действия и неговите проявления, то Аллах е едновременно и извършителят и приемникът на действието. Следователно всяко едно от тези имена може да бъде прочетено едновременно в активната му и пасивна форма. Например име №3 може да бъде прочетено като „Милостив и помилван“, №9 – като „Ценящ и ценен“, №19 – като „Чуващ и чут“ и т.н."},{"t":"p","h":"<b>Третата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, повторено многократно. При хората, често това обозначава професия. Всички имена по тази форма са преведени с добавката „<i>безбройно много пъти<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>много пъти<\/i>“, „<i>многократно<\/i>“, „<i>неизброимо<\/i>“, „<i>отново и отново<\/i>“, „<i>едно след друго<\/i>“ и подобните на тях. Например име №28 „Даряващ прехраната безбройно много пъти“ може да бъде прочетено още и като „Даряващ прехраната много пъти“, „Даряващ прехраната многократно“, „Даряващ прехраната неизброимо“, „Даряващ прехраната отново и отново“, „Даряващ прехраната едно след друго“ и подобните на тях. Имената по тази форма са следните:"},{"t":"chips","items":[["رَزَّاق",28],["تَوَّاب",34],["وَهَّاب",35],["خَلَّاق",44],["غَفَّار",57],["مَنَّان",60],["فَتَّاح",69],["جَبَّار",8]]},{"t":"p","h":"<b>Четвъртата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, изпълнено до съвършенство, получило всеобхватност, без да остави нищо недокоснато от него. Всички имена по тази форма са преведени с добавката „<i>всеобхватно<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>напълно<\/i>“, „<i>изцяло<\/i>“ и подобните на тях. Например име №2 „Всеобхватно милостивият“ може да бъде прочетено още и като „Напълно милостивият“, „Изцяло милостивият“ и подобните на тях. Имената по тази форма са следните:"},{"t":"chips","items":[["رَحْمٰن",2],["مَنَّان",60],["غُفْرَان",77]]},{"t":"p","h":"<b>Петата форма<\/b> означава изходното действие, обозначено от трибуквения корен на думата, придобило постоянство и стабилност. Всички имена по тази форма са преведени с добавката „<i>винаги<\/i>“. Тази добавка може да бъде заменена и със следните равнозначни фрази: „<i>постоянно<\/i>“, „<i>непрестанно<\/i>“, „<i>неизменно<\/i>“ и подобните на тях. Например име №13 „Винаги благодарен“ може да бъде прочетено още и като „Постоянно благодарен“, „Непрестанно благодарен“, „Неизменно благодарен“ и подобните на тях. Имената по тази форма са следните:"},{"t":"chips","items":[["شَكُور",13],["غَفُور",14],["وَدُود",15]]},{"t":"p","h":"Въпреки това, трябва да се има предвид, че значенията, които тези морфологични форми носят не са закон, без изключения, а по-скоро обща закономерност, която да служи за ориентир на читателя. А точното значение на думата може да се определи със сигурност единствено от езиковата традиция на арабите от времето на Пратеника на Аллах <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صَلَّى ٱللَّٰهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ<\/span> ."},{"t":"p","h":"Освен основния превод, за всяко от имената са посочени няколко допълнителни превода в скобите след него. Уважаемият читател е окуражен да избере този превод, който чувства най-въздействащ, а после според морфологичната му форма да го съчетае с най-въздействащата върху сърцето му добавка. Например име №14 „Винаги прощаващ“ може да бъде прочетено още и като „Винаги извиняващ“, „Винаги прикриващ“ и „Винаги предпазващ“. Морфологичните добавки от тази форма от своя страна могат да бъдат прочетени като „Постоянно прощаващ“, „Непрестанно прощаващ“, „Неизменно прощаващ“. И от съчетаването на различните преводи с различните морфологични добавки се получават различните възможни варианти: „Постоянно извиняващ“, „Непрестанно извиняващ“, „Неизменно извиняващ“, „Постоянно прикриващ“, „Непрестанно прикриващ“, „Неизменно прикриващ“, „Постоянно предпазващ“, „Непрестанно предпазващ“, „Неизменно предпазващ“ и подобните на тях. Та така от пеенето на дюата да има най-голяма полза и връзката с Аллах да бъде почувствана най-силно."},{"t":"p","h":"По същия начин към превода на айетите, цитирани след имената на Аллах, е добавено кратко пояснение на смисъла, поместено в скоби, с по-дребен шрифт. Това пояснение е тълкуване, което не е част от оригиналния текст на айетите."}],"corrIntro":"Рамазанската дюа се състои от 78 имена на Аллах, след всяко от които е поместен айета, от който съответното име е извлечено. На няколко места в ръкописите на дюата има разминавания, които са редактирани в настоящата разпечатка. На следващата страница са дадени местата с разминаване, според поместеното в ръкописите.","corr":[{"tr":"Йа̄ муте‘а̄љ (6) Фете‘а̄лел̣ л̣о̄хуљ меликуљ х̱ак̣к̣уљ мубӣн.","ar":{"pieces":[{"w":31.3,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"1.3 14.7 15.5\" y=\"63.8 36.9 63.8\"><\/text>"},{"w":108.4,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"15.3 1.1 30.5 47.2 44.7 67.4 67.4 88.4 84.2\" y=\"22.6 63.8 63.8 36.9 63.8 36.1 63.8 36.9 63.8\"><\/text>"},{"w":48.8,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"1.8\" y=\"63.8\"><\/text>"},{"w":111.9,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"19.4 0.9 37.1 53.8 51.3 74.0 74.0 93.3 90.8\" y=\"20.1 63.8 63.8 36.9 63.8 36.1 63.8 27.7 63.8\"><\/text>"},{"w":61.9,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"4.6 22.2 0.4 50.8\" y=\"38.6 33.6 63.8 63.8\"><\/text>"},{"w":110.3,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"14.3 0.9 44.6 46.2 68.9 65.5 84.0 89.1 99.2\" y=\"33.6 63.8 65.5 63.8 39.4 63.8 20.1 63.8 63.8\"><\/text>"},{"w":85.4,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\" x=\"13.8 1.2 34.0 42.4 33.1 74.3\" y=\"36.1 63.8 43.6 16.8 63.8 63.8\"><\/text>"},{"w":107.8,"h":90,"svg":"<text font-family=\"zkram145\" font-size=\"59.64\ <script>function ZKU(el,o){if(o&&o.svg){el.classList.add('zsv');el.innerHTML='<svg viewBox="0 0 '+o.w+' '+o.h+'" aria-hidden="true">'+o.svg+'</svg>';return 'none';}return 'url(data:image/png;base64,'+o.b64+')';}

<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const items=D.items;
const AR_K=0.42, AR_FK=0.56;
const plain=h=>{const t=document.createElement('div');t.innerHTML=h;t.querySelectorAll('.x').forEach(e=>e.remove());return t.textContent.replace(/\s+/g,' ').replace(/\s+([!,.])/g,'$1').trim();};

/* storage: works where available, silently in memory elsewhere */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem('rdua:'+k);if(v!=null)return JSON.parse(v);}catch(e){} return mem[k];},
  set(k,v){mem[k]=v;try{localStorage.setItem('rdua:'+k,JSON.stringify(v));}catch(e){}}
};

function arEl(a,k,label){if(a&&a.pieces){const f=document.createElement('div');f.className='arflow zk-flow';f.setAttribute('lang','ar');if(label){f.setAttribute('role','img');f.setAttribute('aria-label',label);}a.pieces.forEach(function(c){f.appendChild(arEl0(c,k,null));});return f;}return arEl0(a,k,label);}
function arEl0(a,k,label){
  const d=document.createElement('div');
  d.className='arimg';d.setAttribute('role','img');if(label)d.setAttribute('aria-label',label);
  const u=ZKU(d,a);
  d.style.webkitMaskImage=u;d.style.maskImage=u;
  d.style.aspectRatio=a.w+' / '+a.h;
  d.style.width='calc('+(a.w*k).toFixed(1)+'px * var(--s-ar))';
  return d;
}
function label(it){
  if(it.kind==='open') return it===items[0]?'Бисмиллях':'Аллахумме';
  if(it.kind==='close') return 'Заключение';
  return it.nums.join('–')+'. '+it.names.map(plain).map(s=>s.replace(/!$/,'')).join(', ');
}
function idOf(i){const it=items[i];return it.kind==='name'?'n'+it.nums[0]:it.kind==='close'?'n-end':'n-o'+i;}
function trHtml(it){
  if(it.kind!=='name') return esc(it.tr);
  return it.trNames.map((n,j)=>'Йа̄ '+esc(n)+' <span class="y">('+it.nums[j]+')</span>').join(' ')+' '+esc(it.trAyah);
}
function bgHtml(it){
  if(it.kind!=='name') return it.bg;
  return it.names.map(n=>'<span class="nm">Ей, '+n.trim()+'</span>').join(' ')+'<span class="ay">'+it.ayah+'</span>';
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- build reader ---------- */
const R=$('#reader');
function sec(id,title,lede){const s=document.createElement('section');s.className='sec';s.id=id;s.innerHTML='<h2>'+title+'</h2>'+(lede?'<p class="lede">'+lede+'</p>':'');R.appendChild(s);return s;}

const sIntro=sec('intro','За дюата');
const pi=document.createElement('div');pi.className='prose';
D.intro.forEach(p=>{pi.insertAdjacentHTML('beforeend',p.t==='h'?'<h3>'+p.h+'</h3>':'<p>'+p.h+'</p>');});
sIntro.appendChild(pi);

const sDua=sec('dua','Рамазанската дюа','Числото след всяко име показва колко пъти е най-добре то да се повтори.');
items.forEach((it,i)=>{
  const a=document.createElement('article');
  a.className='item'+(it.kind==='name'?'':' plain');a.id=idOf(i);a.dataset.i=i;
  a.innerHTML='<div class="num">'+(it.kind==='name'?'<a href="#'+idOf(i)+'">'+it.nums.join('<br>')+'</a>':'')+'</div><div class="body"><div class="ar"></div><p class="tr">'+trHtml(it)+'</p><p class="bg">'+bgHtml(it)+'</p></div>';
  a.querySelector('.ar').appendChild(arEl(it.ar,AR_K,it.kind==='name'?('Йа̄ '+it.trNames.join(', Йа̄ ')):it.tr));
  sDua.appendChild(a);
});


/* ---------- reading modes ---------- */
(function(){
  const MODES=[['full','Подробно'],['ar','Арабски'],['bg','Български']];
  const sw=document.createElement('div');sw.className='rmode';sw.setAttribute('role','group');sw.setAttribute('aria-label','Режим на четене');
  sw.innerHTML='<div class="rmode-in">'+MODES.map(m=>'<button type="button" data-m="'+m[0]+'">'+m[1]+'</button>').join('')+'</div>';
  const first=sDua.querySelector('article.item');
  sDua.insertBefore(sw,first);
  const ca=document.createElement('div');ca.className='cont cont-ar';ca.setAttribute('lang','ar');ca.setAttribute('dir','rtl');
  const cb=document.createElement('div');cb.className='cont cont-bg';
  sDua.insertBefore(ca,first);sDua.insertBefore(cb,first);
  const AD='٠١٢٣٤٥٦٧٨٩',arn=n=>String(n).replace(/\d/g,d=>AD[d]);
  let built=false;
  function build(){
    if(built)return;built=true;
    const f=document.createElement('div');f.className='arflow zk-flow cflow';
    items.forEach(it=>{
      const e=arEl(it.ar,AR_K,null);
      if(e.classList.contains('zk-flow'))[...e.children].forEach(c=>f.appendChild(c));else f.appendChild(e);
    });
    ca.appendChild(f);
    const part=k=>items.filter(it=>it.kind===k).map(it=>(it.kind==='name'?'<b class="cnb">'+it.nums.join('–')+'.</b> ':'')+bgHtml(it).replace('<span class="ay">',' <span class="ay">')).join(' ');
    cb.innerHTML='<p class="bg">'+part('open')+'</p><p class="bg">'+part('name')+'</p><p class="bg">'+part('close')+'</p>';
  }
  function apply(m,user){
    if(!MODES.some(x=>x[0]===m))m='full';
    if(m!=='full')build();
    sDua.dataset.mode=m;
    sw.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
    store.set('mode',m);
    if(user&&sDua.getBoundingClientRect().top<0)sDua.scrollIntoView();
  }
  sw.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)apply(b.dataset.m,true);});
  /* links / search results that point at a single name need the detailed view */
  const needFull=id=>id&&/^n/.test(id)&&sDua.dataset.mode!=='full';
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#n"]');if(a&&needFull(a.getAttribute('href').slice(1)))apply('full');},true);
  addEventListener('hashchange',()=>{if(needFull(location.hash.slice(1))){apply('full');const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();}});
  const q=new URLSearchParams(location.search);
  apply((q.get('zkq')!==null||/^#n/.test(location.hash))?'full':(store.get('mode')||'full'));
  function stick(){const b=document.querySelector('.bar');sw.style.top=((b?b.getBoundingClientRect().height:56)-1)+'px';}
  stick();addEventListener('resize',stick);
})();
const sLet=sec('letters','Транскрипция на буквите','Удължените букви са отбелязани с чертичка над тях, а удебелените – с точка под тях.');
const L=[['ء','а'],['ب','б'],['ت','т'],['ث','с̱'],['ج','ж̱'],['ح','х̱'],['خ','х̣'],['د','д'],['ذ','з̱'],['ر','р <small>или</small> р̣'],['ز','з'],['س','с'],['ش','ш'],['ص','с̣'],['ض','д̣'],['ط','т̣'],['ظ','з̣'],['ع','‘ <small>или</small> а‘'],['غ','г̣'],['ف','ф'],['ق','к̣'],['ك','к'],['ل','л <small>или</small> љ <small>или</small> л̣'],['م','м'],['ن','н'],['هـ','х'],['و','ў'],['ى','й']];
sLet.insertAdjacentHTML('beforeend','<div class="lede" style="margin:0">Съгласни [Х̱ур̣ӯф]</div><div class="letters">'+L.map(x=>'<div class="lt"><span class="c">'+x[1]+'</span><span class="a" lang="ar">'+x[0]+'</span></div>').join('')+'</div>'+
 '<table class="vow"><tr><th colspan="2">Кратки гласни [Х̱ар̣акя̄т]</th></tr><tr><td>у или ю</td><td>д̣амме</td></tr><tr><td>и</td><td>кесра</td></tr><tr><td>а или е</td><td>фетх̱а</td></tr>'+
 '<tr><th colspan="2">Дълги гласни [Х̱ур̣ӯф ељ-медд]</th></tr><tr><td>ӯ или ю̄</td><td>ўа̄ў</td></tr><tr><td>ӣ</td><td>йа̄</td></tr><tr><td>а̄ или о̄ или я̄</td><td>елиф</td></tr></table>');

const sMor=sec('forms','Морфологичните форми на имената');
const pm=document.createElement('div');pm.className='prose';
D.morph.forEach(p=>{
  if(p.t==='chips'){pm.insertAdjacentHTML('beforeend','<div class="chips">'+p.items.map(c=>'<a href="#n'+(c[1]===33?32:c[1])+'"><span lang="ar">'+c[0]+'</span><b>'+c[1]+'</b></a>').join('')+'</div>');}
  else pm.insertAdjacentHTML('beforeend','<p>'+p.h+'</p>');
});
sMor.appendChild(pm);

const sCor=sec('fixes','Корекции в ръкописа');
sCor.insertAdjacentHTML('beforeend','<div class="prose"><p>'+D.corrIntro+'</p></div>');
const cw=document.createElement('div');cw.className='corr';
D.corr.forEach(c=>{const d=document.createElement('div');d.appendChild(arEl(c.ar,AR_K,c.tr));d.insertAdjacentHTML('beforeend','<p>'+esc(c.tr)+'</p>');cw.appendChild(d);});
sCor.appendChild(cw);

/* hero */
const h=D.hero, cal=$('#cal');const u=ZKU(cal,h);
cal.style.cssText+='background:var(--ink);-webkit-mask:'+u+' center/contain no-repeat;mask:'+u+' center/contain no-repeat;aspect-ratio:'+h.w+'/'+h.h;

/* toc, grid, jump */
const toc=[['intro','За дюата','Предание и наставления'],['dua','Рамазанската дюа','78 имена'],['letters','Транскрипция на буквите',''],['forms','Морфологичните форми','5 форми'],['fixes','Корекции в ръкописа',D.corr.length+' места']];

  else if(e.key==='ArrowLeft'||e.key==='PageUp')$('#fPrev').click();
  else if(e.key===' '&&$('#tap')){e.preventDefault();$('#tap').click();}
});
let tx=null;

fb.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70){dx<0?$('#fNext').click():$('#fPrev').click();}});
})();

    fclose.parentNode.insertBefore(fstar,fclose);
    fstar.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(fcur)toggle(fcur);});
    var mo=new MutationObserver(function(){clearTimeout(mo.t);mo.t=setTimeout(syncF,30);});mo.observe(fbody,{childList:true,subtree:true,characterData:true});
  }
  var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(place,150);});
  addEventListener('orientationchange',function(){setTimeout(place,300);});addEventListener('pageshow',function(){setTimeout(place,100);});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')setTimeout(place,100);});
  if(window.ResizeObserver){var ro=new ResizeObserver(function(){clearTimeout(rt);rt=setTimeout(place,150);});ro.observe(document.body);}
  addEventListener('storage',function(e){if(e.key===KEY)paint();});
  function start(){setup();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);setTimeout(place,800);}
  if(document.readyState==='complete')setTimeout(start,30);else addEventListener('load',function(){setTimeout(start,30);});
  /* settings like "hide Arabic" change layout -> re-place */
  new MutationObserver(function(){clearTimeout(rt);rt=setTimeout(place,120);}).observe(document.body,{attributes:true,attributeFilter:['class','style']});
  new MutationObserver(function(){clearTimeout(rt);rt=setTimeout(place,120);}).observe(document.documentElement,{attributes:true,attributeFilter:['style','data-theme']});
})();
(function(){
  var K='zk:theme',W='zk:wake';
  function g(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function s(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  /* one theme for all books */
  var seg=document.getElementById('themeSeg');
  if(seg){
    var t=g(K);
    if(t){var b=seg.querySelector('[data-t="'+t+'"]');if(b&&b.getAttribute('aria-pressed')!=='true')b.click();}
    seg.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-t]');if(b)s(K,b.dataset.t);});
  }
  /* keep the screen on */
  var sup=('wakeLock' in navigator),lock=null,on=g(W)==='1',pend=false;
  function req(){if(!sup||!on||lock||pend||document.visibilityState!=='visible')return;pend=true;
    navigator.wakeLock.request('screen').then(function(l){pend=false;lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){pend=false;});}
  function rel(){if(lock){try{lock.release();}catch(e){}lock=null;}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')req();});
  document.addEventListener('click',req,{passive:true});
  window.zkWake={sup:sup,get:function(){return on;},set:function(v){on=!!v;s(W,on?'1':'0');if(on)req();else rel();}};
  var panel=document.getElementById('panel');
  if(panel&&sup&&!document.getElementById('zkWake')){
    var grp=document.createElement('div');grp.className='grp';
    grp.innerHTML='<h3>Екран</h3><label class="tog"><span>Екранът да не изгасва<small style="display:block;font-size:13px;color:var(--muted);font-weight:400">Докато приложението е отворено</small></span> <input type="checkbox" id="zkWake"></label>';
    panel.appendChild(grp);
    var cb=grp.querySelector('input');cb.checked=on;cb.addEventListener('change',function(){window.zkWake.set(cb.checked);});
  }

})();
/* Back button: closes settings / one-by-one mode first, then returns to the book's title page,
   and only then leaves the book. Settings get a close (×) button. */
(function(){
  var H=history;if(!H||!H.pushState)return;
  var P=H.pushState.bind(H),R=H.replaceState.bind(H);
  var hero=document.getElementById('top');
  var panel=document.getElementById('panel')||document.getElementById('zkPanel');
  var setBtn=document.getElementById('setBtn')||document.getElementById('zkSet');
  var focus=document.getElementById('focus'),fClose=document.getElementById('fClose');
  function st(){return (H.state&&H.state.zk)||null;}
  function atStart(){if(!hero)return true;var r=hero.getBoundingClientRect();return r.bottom>80;}
  if(hero){try{H.scrollRestoration='manual';}catch(e){}}
  var cur=st();
  if(!cur||cur==='panel'||cur==='focus'||cur==='_c'){cur='root';try{R({zk:'root'},'');}catch(e){}}
  /* app code that used pushState for in-book jumps -> keep a single "inside the book" entry */
  H.pushState=function(s,t,u){try{if(cur==='root'&&hero){P({zk:'book'},t||'',u);cur='book';}else R(H.state,t||'',u);}catch(e){}};
  H.replaceState=function(s,t,u){try{R(s&&s.zk?s:H.state,t||'',u);}catch(e){}};
  function active(){var u=navigator.userActivation;return !u||u.hasBeenActive;}
  function enter(){if(hero&&cur==='root'&&!atStart()&&active()){try{P({zk:'book'},'');cur='book';}catch(e){}}}
  addEventListener('scroll',enter,{passive:true});
  ['click','touchend','keydown'].forEach(function(t){addEventListener(t,function(){setTimeout(enter,60);},{passive:true,capture:true});});
  function toTop(){try{scrollTo({top:0,left:0,behavior:'instant'});}catch(e){scrollTo(0,0);}}
  /* in-page links: no extra history entries; "#top" = back to the title page */
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button)return;
    var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
    var h=a.getAttribute('href');
    if(h==='#top'||h==='#'){if(!hero)return;e.preventDefault();if(cur==='book')H.back();else toTop();return;}
    var el=document.getElementById(decodeURIComponent(h.slice(1)));if(!el||a.closest('#focus'))return;
    e.preventDefault();H.pushState(null,'',h);el.scrollIntoView();
  });
  /* layers */
  function pOpen(){return !!panel&&(panel.id==='zkPanel'?!panel.hidden:panel.classList.contains('open'));}
  function pClose(){if(!panel)return;if(panel.id==='zkPanel')panel.hidden=true;else panel.classList.remove('open');if(setBtn)setBtn.setAttribute('aria-expanded','false');}
  function fOpen(){return !!focus&&focus.classList.contains('open');}
  function fShut(){if(fClose)fClose.click();else if(focus)focus.classList.remove('open');}
  function watch(el,name,isOpen){if(!el)return;var was=isOpen();
    new MutationObserver(function(){var o=isOpen();if(o===was)return;was=o;
      if(o){if(cur!==name){try{P({zk:name},'');cur=name;}catch(e){}}}
      else if(cur===name){cur='_c';H.back();}
    }).observe(el,{attributes:true,attributeFilter:['class','hidden']});}
  watch(panel,'panel',pOpen);watch(focus,'focus',fOpen);
  addEventListener('popstate',function(){
    var prev=cur;cur=st()||'root';
    var closed=false;
    if(cur!=='panel'&&pOpen()){pClose();closed=true;}
    if(cur!=='focus'&&fOpen()){fShut();closed=true;}
    if(closed||prev==='_c'||prev==='panel'||prev==='focus')return;
    if(cur==='root'&&hero)toTop();
  });
  /* × button in the settings panel */
  if(panel){
    var x=document.createElement('button');x.type='button';x.className='zk-px';x.setAttribute('aria-label','Затвори');x.title='Затвори';
    x.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    x.addEventListener('click',function(e){e.stopPropagation();pClose();});
    panel.insertBefore(x,panel.firstChild);
    var cs=document.createElement('style');
    cs.textContent='#'+panel.id+'{padding-top:'+(panel.id==='zkPanel'?'34px':'18px')+'}'+'.zk-px{position:absolute;top:8px;right:8px;z-index:3;width:38px;height:38px;padding:0;border:1px solid var(--rule,#ccc);border-radius:50%;background:var(--sheet,#fff);color:var(--ink,#222);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}'+
      '.zk-px svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}.zk-px::before{content:"";position:absolute;inset:-6px}';
    document.head.appendChild(cs);
  }
})();
