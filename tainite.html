<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Книгата на тайните</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F3F3F1; --sheet:#FFFFFF; --ink:#1C1C1A; --muted:#62615C; --deep:#5A4632; --gold:#937238; --rule:#E0DFDA; --wash:#ECEAE4;
  --s-ar:1.2; --s-tr:1; --s-bg:1;
  --serif:"Literata", "Noto Serif", Georgia, serif;
  --tr:"Noto Serif", "Literata", Georgia, serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arf:"Amiri", "Traditional Arabic", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131311; --sheet:#1B1B18; --ink:#ECEBE6; --muted:#A5A39B; --deep:#D9BE9C; --gold:#D6B36A; --rule:#2D2C28; --wash:#22211E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131311; --sheet:#1B1B18; --ink:#ECEBE6; --muted:#A5A39B; --deep:#D9BE9C; --gold:#D6B36A; --rule:#2D2C28; --wash:#22211E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* arabic image rendered as a mask so it follows the theme colour */
.arimg{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:right center;mask-position:right center;max-width:100%;margin-left:auto;color:var(--ink)}
.hon,.arw{unicode-bidi:isolate}
.hon{font-family:var(--arf);font-size:.95em;color:var(--gold);white-space:nowrap}
.arw{font-family:var(--arf);font-size:1.25em;color:var(--deep)}

/* bar */
.bar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--sans)}
.bar-title{font:600 16px var(--sans);color:var(--ink);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{appearance:none;-webkit-appearance:none;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 30px 7px 10px;font:500 15px var(--sans);color:var(--ink);max-width:44vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* settings */
.panel{position:fixed;z-index:30;right:max(12px,calc((100vw - 820px)/2 + 12px));top:calc(env(safe-area-inset-top,0px) + 60px);width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;font-family:var(--sans);box-shadow:0 14px 40px rgba(8,20,18,.2);display:none}
.panel.open{display:block}
.panel h3{margin:0 0 6px;font:500 13px var(--sans);color:var(--muted)}
.grp+.grp{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px;cursor:pointer}
.tog small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.tog input{flex:none;appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--rule);position:relative;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--deep)}
.tog input:checked::after{transform:translateX(18px)}
.step{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:16px}
.ctl{display:inline-flex;align-items:center;gap:4px}
.ctl button{width:34px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:18px;line-height:1}
.ctl output{min-width:44px;text-align:center;font-size:14px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;border:0;background:transparent;cursor:pointer;font-size:15px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--paper)}

/* hero */
.hero{max-width:820px;margin:0 auto;padding:56px 20px 24px;text-align:center}
.hero .cal{margin:0 auto;width:min(560px,92%)}
.hero h1{font:400 clamp(26px,5vw,36px)/1.2 var(--serif);margin:28px 0 8px;letter-spacing:.005em}
.hero p.sub{margin:0 auto;max-width:34em;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:var(--paper);font:500 16px var(--sans);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep)}

.contents{max-width:760px;margin:24px auto 0;padding:0 20px;text-align:left;font-family:var(--sans)}
.contents h2{font:500 14px var(--sans);color:var(--muted);margin:26px 0 8px}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:16px}
.toc a span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid a{display:flex;align-items:center;justify-content:center;height:42px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);text-decoration:none;color:var(--ink);font:500 15px var(--sans)}
.grid a:hover{border-color:var(--deep);color:var(--deep)}
.grid a.cur{background:var(--deep);border-color:var(--deep);color:var(--paper)}

/* reader */
main{max-width:760px;margin:0 auto;padding:0 20px 80px}
.sec{padding-top:44px}
.sec>h2{font:400 clamp(24px,4vw,30px)/1.25 var(--serif);margin:0 0 6px}
.sec>.lede{color:var(--muted);font:400 15px/1.5 var(--sans);margin:0 0 18px}
.prose p{margin:0 0 1em;hyphens:auto;-webkit-hyphens:auto}
.prose h3{font:italic 400 20px var(--serif);color:var(--deep);margin:1.4em 0 .4em}
.prose b{font-weight:600}

.item{position:relative;display:grid;grid-template-columns:40px 1fr;gap:4px 14px;padding:22px 0;border-bottom:1px solid var(--rule)}
.item:first-of-type{border-top:1px solid var(--rule)}
.num{font:600 15px/1 var(--sans);color:var(--gold);padding-top:8px;text-align:left}
.num a{color:inherit;text-decoration:none}
.body{min-width:0}
.item.plain{grid-template-columns:1fr}
.item.plain .num{display:none}
.ar{margin:0 0 12px}
.tr{font-family:var(--tr);font-style:italic;color:var(--deep);font-size:calc(17px*var(--s-tr));line-height:1.55;margin:0 0 8px}
.tr .y{font-style:normal;font-weight:400}
.bg{font-size:calc(17.5px*var(--s-bg));line-height:1.6;margin:0}
.bg .nm{font-weight:600}
.bg .nm .x{font-weight:400}
.bg .ay{display:block;margin-top:4px}
.x{color:var(--muted);font-size:.86em}
body.nox .x{display:none}
body.noar .ar, body.notr .tr, body.nobg .bg{display:none}
.item.cur{background:linear-gradient(90deg,var(--wash),transparent 85%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.rep{font:400 13px var(--sans);color:var(--muted);margin-top:6px}

/* appendices */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:12px 0 18px;direction:rtl}
.lt{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lt .a{font-family:var(--arf);font-size:28px;line-height:1.1}
.lt .c{font-family:var(--tr);font-size:18px;text-align:right}
.lt .c small{color:var(--muted);font-size:12px;font-family:var(--sans)}
.vow{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:16px}
.vow th{font:500 13px var(--sans);color:var(--muted);text-align:left;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.vow td{padding:8px 0;border-bottom:1px solid var(--rule)}
.vow td:first-child{font-family:var(--tr)}
.vow td:last-child{color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 1.2em;direction:rtl}
.chips a{direction:ltr;display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);text-decoration:none;color:var(--ink)}
.chips a b{font:500 12px var(--sans);color:var(--gold)}
.chips a span{font-family:var(--arf);font-size:19px}
.corr{border-top:1px solid var(--rule);margin-top:12px}
.corr div{padding:14px 0;border-bottom:1px solid var(--rule)}
.corr p{margin:6px 0 0;font-family:var(--tr);font-style:italic;color:var(--deep);font-size:16px}

.arflow{display:flex;flex-wrap:wrap;direction:rtl;align-items:flex-end;column-gap:calc(7px*var(--s-ar));row-gap:0}
.arflow .arimg{margin:0;flex:none}
.arttl{font:400 clamp(44px,10vw,64px)/1.2 var(--arf);color:var(--ink);margin:0}
/* focus */
.focus{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.focus.open{display:flex}
.f-top{display:flex;align-items:center;gap:10px;max-width:820px;width:100%;margin:0 auto;padding:10px 16px;font-family:var(--sans)}
.f-top .where{margin-right:auto;font-size:15px;color:var(--muted)}
.prog{height:3px;background:var(--rule);max-width:820px;width:calc(100% - 32px);margin:0 auto;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.f-body{flex:1;overflow:auto;width:100%;max-width:760px;margin:0 auto;padding:28px 20px}
.f-body .fnum{font:600 15px var(--sans);color:var(--gold);margin-bottom:14px}
.f-body .ar{margin-bottom:22px}
.f-body .tr{font-size:calc(19px*var(--s-tr))}
.f-body .bg{font-size:calc(19px*var(--s-bg))}
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;margin:30px 0 4px}
.tap{width:132px;height:132px;border-radius:50%;border:2px solid var(--deep);background:var(--sheet);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
.tap svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);transform:rotate(-90deg)}
.tap circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .15s}
.tap b{font:600 34px/1 var(--sans);color:var(--ink)}
.tap span{font-size:13px;color:var(--muted);margin-top:4px}
.tap.done{background:var(--deep);border-color:var(--deep)}
.tap.done b,.tap.done span{color:var(--paper)}
.tap:active{transform:scale(.97)}
.counter .hint{font:400 13px var(--sans);color:var(--muted);text-align:center}
.counter .reset{border:0;background:none;color:var(--muted);font:400 14px var(--sans);text-decoration:underline;cursor:pointer}
.f-nav{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;padding:10px 16px 14px}
.f-nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font:500 16px var(--sans);cursor:pointer}
.f-nav .next{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.f-nav button:disabled{opacity:.4;cursor:default}

@media (max-width:520px){
  body{font-size:17px}
  .item{grid-template-columns:30px 1fr;gap:4px 10px}
  .hero{padding-top:36px}
}
</style>

очвам по пътя, който спасява пропадащите от гибел, и от него искам да ми даде успех по правия път и предостатъчно покорство пред него, и него моля своята мъдрост да ми разкрие и да отстрани от мен противенето нему. Наистина Единият, Единственият, Неповторимият, Вечният, комуто няма равен, нито родител, нито дете, нито времето го засяга, нито го броят числата, устрои земята и небето и сътвори от нищо всяко нещо, и започна отначало всяко творение, без помощник редом с него в подреждането на света, нито пълномощник, който изпълнява решените от него дела. И не го докосна умора, нито го накара да прекъсне отегчение, нито му попречиха препятствия за майсторското му произведение. И не го смути онова, което сътвори изначалното му знание, а напротив – чрез волята му се изпълни решението му, а творението му се случи напълно според знанието му, без да се породи в него съмнение, където да не отличава мненията, нито въображение, където да не съответстват едно с друго нещата. Той е над онова, което злодеите безпросветни казват за него и още по-съвършен от онова, което справедливите просветени говорят за него. Стори хората народи и племена, които взаимно да се познават, а за онова, за което душите се състезават – да не се съгласяват. Стремежите им са различни, а постъпките – разнородни. И всеки постъпва по свой образ и следва пътя на своето време. И умовете са разпределени по дялове, а заложбите са дадени по природа. И благоразумният се радва на вдъхновеното и е щастлив с отреденото. А невнимателния страда за изтърваното и скърца със зъби от съжаление. И ако надвие душата си да си върне пропуснатото, слабото му старание го въвлича още повече в затруднение, а продължи ли с нехайството си попада в безизходица заради своето малодушие.","n":0},{"ar":[{"w":356,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"336.6 316.5 326.2 326.2 302.9 301.0 290.0 292.5 262.1 282.2 264.0 249.8 257.6 249.8 239.4 238.1 214.1 222.6 196.6 194.7 186.3 186.3 174.0 176.6 141.6 160.4 151.9 елата му.","n":7},{"ar":[{"w":367,"h":55,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"357.6 357.6 349.8 309.0 333.0 312.9 322.6 334.3 282.4 285.7 276.6 274.7 264.3 266.3 250.7 250.1 233.2 237.7 211.8 220.2 210.5 199.5 201.5 182.0 191.7 180.1 164.5 172.9 140.5 145.1 125.0 132.8 125.0 112.0 115.3 79.6 99.1 79.6 90.0 71.9 71.9 51.8 64.1 54.4 28.4 35.6 1.2 16.8 9.6\" y=\"36.6 21.7 36.6 36.6 36.6 28.2 21.7 22.3 36.6 23.0 36.6 13.9 36.6 22.3 36.6 7.4 36.6 18.5 36.6 36.6 12.6 36.6 21.7 36.6 36.6 37.2 36.6 16.5 36.6 22.3 36.6 36.6 21.7 36.6 24.3 36.6 36.6 7.4 11.3 36.6 21.0 36.6 36.6 21.0 36.6 22.3 36.6 36.6 13.9\"><\/text><text font-family=\"zktai191\" font-size=\"32.4\" x=\"301.9\" y=\"36.6\"><\/text>"},{"w":299,"h":55,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"279.6 282.9 270.6 271.2 255.0 262.8 252.4 242.7 242.1 227.8 225.2 215.5 217.4 194.8 194.8 205.1 163.0 181.8 162.4 173.4 148.8 152.0 139.7 138.4 119.6 122.2 99.5 106.6 87.2 90.4 67.1 70.4 46.4 62.6 46.4 33.4 36.0 1.7 17.9\" y=\"36.6 21.7 36.6 23.0 36.6 36.6 37.2 36.6 37.2 36.6 42.4 36.6 19.1 36.6 44.4 20.4 36.6 36.6 37.9 11.3 36.6 21.0 36.6 37.9 36.6 20.4 36.6 15.9 36.6 34.0 36.6 23.0 36.6 36.6 23.0 36.6 17.2 36.6 38.5\"><\/text>"},{"w":364,"h":55,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"351.2 354.5 327.2 346.7 331.1 337.6 319.5 318.2 306.5 309.8 289.7 302.0 292.9 276.0 274.8 262.4 263.7 247.5 247.5 215.1 219.7 197.6 201.5 184.0 182.7 165.2 176.9 139.3 146.5 110.2 133.5 118.6 86.2 90.1 90.7 101.1 59.0 68.7 38.9 41.5 26.6 27.9 11.0 13.0 2.6 0.0\" y=\"36.6 23.0 36.6 36.6 43.1 11.3 36.6 20.4 36.6 24.3 36.6 36.6 34.0 36.6 13.9 36.6 22.3 36.6 21.7 36.6 19.8 36.6 22.3 36.6 40.5 36.6 12.0 36.6 15.9 36.6 36.6 21.0 36.6 47.0 28.2 47.6 36.6 40.5 36.6 21.7 36.6 21.0 36.6 37.9 36.6 37.2\"><\/text>"},{"w":365,"h":55,"svg":"<text font-family=\" AAAAAAAAAAAAAA16TeWAAAABHRSTlMAVar/oA4xLwAAAA9JREFUeNpjYBgigAVKAwAA0QAF8fkMpgAAAABJRU5ErkJggg=="}],"bg":"<b><em>Синко мой<\/em><\/b>, и от най-чудните неща е човек с побелели коси, обгърнат от нещастия, обхванат от беди, отричащ превратностите на дните, рушащ бъдещето с отлагане. И това е заради слабата му натура и забравянето на преживелиците от миналото, и небрежността и нехайство към наученото от опита и изпробваното на практика. И ако изчезнат от погледа на разумния всички удивителни създания и спрат към учения вестите за всички чудати творения, то в собствената си природа и в своите състоянията, прекарвани ден след ден, като бедност и богатство, и радост и печал, и изобилие и недоимък, и вземане и даване, и харчене и въздържание, и дългото мълчание, и малкото говорене, и многото замисляне, и голямото спокойствие, и бързото смущение, и шеговитост и сериозност, и победата на глупостта над разума, щяха да намерят най-добро занимание. И то щеше да отвлече вниманието им от занимаване с чуждите нрави и знанието и незнанието, с които се отличават, защото добрите от тях са известни, а лошите от тях са открити. И който склони към по-малкото, губи и попада в затруднение, винейки положението, и делата му са в опасност, и го опечалява завършекът им с онова, за което го бе известило началото им. И не е мъдрец стремящият се към порицаното, нито следва пътя на разума заслепеният от самовъзхищение. И който вземе за прицела на окото си другия, и упрекне за нещо чуждото действие, а той самия, за целещия неговите недъзи, е по-лесна мишена за упрек, трябва самия себе си, със своите упреци, още повече да вземе за прицел. Защото, който порицае нещо у другия, а е доволен да има подобно у себе си, вече е показал своята глупост. И който изпуска онова, което го засяга е още по-неспособен да хване онова, което не го засяга. Затова проумей, <b><em>синко мой<\/em><\/b>, това, което ти казвам и от особеностите на твоето време ти разяснявам!","n":9},{"ar":[{"w":360,"h":58,"svg":"<text font-f ащото, и доброто от лошото, и ползата от вредата, и горещината от студа, като погледне в себе си и види чертите си? И когато мързелът го докара до лишение, а рахатът до бездействие, после го нападнат стеклите се обстоятелства и произтеклите нещастия, и веднъж го подбудят към гняв, а друг път към задоволство, той престъпва границите и във двата случая и се отклонява и от двата пътя. Къде е опитът от миналото му и защо не отблъсква чрез него от себе си болезнените удари и настъпващите бедствия? Та да спечели за себе си чрез отблъскването им скорошна утеха и да премахне от себе си белезите на нещастието, и да устрои задълго своето щастие, и да защити себе си от опасното. И ако беше внушил душата си с най-доброто внушение, щеше да се избави от тежките главоболия и нямаше да изпусне хубавия завършек и споменаването с добро при хорските сбирки, и похвалния глас при техните празници. И щеше да прекрати оплакването си, и да признае превъзходството на онзи, който не следва пътя му. Вместо това не пази носа си и малко отбягва желаното от душата му, та се множат болестите по него и му отнемат достойнствата на характера, а той търси спасението там, където го няма и се стреми към спокойствието след като му е убягнало. Ала не, няма производна без да има основа, нито щедрост без харчене, нито успех без добрини, с които да натовари душата си и да спечели висока похвала, и да я предпази от престъпления и от пагубни страсти. И няма душа, която да не съблазнява притежателя си към страсти и да не го тегли към изворите на гибел. И който ѝ даде юздата си тя го оседлава и обуздава, а който я възпре от желанията ѝ се добира до най-висшето пожелание. И в тези думи за теб, <b><em>синко мой<\/em><\/b>, има поука и наставление.","n":10},{"ar":[{"w":328,"h":61,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"315.1 318.3 304.1 306.7 286.6 290.5 272.3 270.4 258.7 260.0 245.1 241.9 225.0 230.2 215.9 216.6 199.1 204.3 186.8 186.8 173.8 175.8 157.6 155.0 127.2 149.8 128.5 132.4 114.2 115 ива, а сладостта на богатството надделява, високото положение рухва, а великодушието и свободата изчезват. И благородството във богатството има своите дялове със своите клони. И от благородство никой не е лишен, щом се стреми към него усърдно и през портите негови влиза. И то няма цена за купуване, а е блага дума, която да кажеш или хубаво, което да сториш, или добро, което да жертваш, или мълчание, когато думите нямат ефект. С тези черти ще постигнеш в благородството степен и положение, щом не можеш да я спечелиш със други. И колкото повече се стремиш, толкова повече ще постигнеш.","n":20},{"ar":[{"w":301,"h":62,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"288.1 291.3 280.3 280.3 264.8 268.0 249.2 248.6 236.9 238.8 216.2 223.3 196.1 198.7 170.8 179.2 155.9 154.0 131.3 139.0 109.2 111.8 82.7 101.5 84.0 65.8 71.7 55.5 55.5 30.2 39.3 13.3 10.7 1.0 0.4\" y=\"36.0 22.4 36.0 15.9 36.0 19.8 36.0 6.8 36.0 21.1 36.0 19.2 36.0 19.8 36.0 21.7 36.0 13.3 36.0 19.2 36.0 21.1 36.0 36.0 18.5 36.0 20.4 36.0 13.3 36.0 21.7 36.0 41.8 36.0 36.6\"><\/text>"},{"w":353,"h":62,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"340.3 346.1 337.0 327.3 329.9 314.4 317.6 291.7 301.4 293.0 283.3 283.3 266.4 263.8 258.0 257.3 239.2 241.1 219.1 225.6 201.6 206.2 167.3 186.7 171.2 177.6 136.2 159.5 143.3 108.3 128.4 114.8 86.9 90.2 75.9 79.1 66.8 66.2 41.6 50.0 26.6 24.7 1.4 9.8\" y=\"36.0 36.0 12.0 36.0 22.4 36.0 23.7 36.0 36.0 23.0 36.0 19.8 36.0 41.8 36.0 6.8 36.0 19.8 36.0 21.7 36.0 45.7 36.0 36.0 42.5 10.7 36.0 36.0 19.2 36.0 36.0 33.4 36.0 22.4 36.0 13.3 36.0 19.2 36.0 21.7 36.0 13.3 36.0 19.2\"><\/text>"},{"w":372,"h":62,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"361.9 363.2 354.1 352.8 330.8 339.2 313.3 318.5 282.2 298.4 282.2 258.9 267.3 231.0 251.1 237.5 205.1 205.1 197.3 196.0 179.8 183.0 164.2 163.6 145.5 148.7 129.9 131.8 120.8 121.5 108.5 111.1 83.9 100.7 81.3  със сила и мощ. И знай, че одобренията и похвалите имат своите здрави основи, към които сърцата се взират, после жертват за тях най-скъпи неща и отправят заради тях камилите към най-далечни страни. Та който го радва да бъде известен с хубаво и с добро, да види откъде се разнасят, после да ги извършва докато стигне до хоризонтите признанието му и укрепне у хората уважението му. После чрез взаимно съгласие да поправи на своята душа кривините и да вземе от нея колкото трябва, за да украси нейното утре. Защото, когато се облагороди характера и външността и вътрешността оздравеят, те се превръщат в богатства, към които пътешествениците тръгват и в красиви истории, които разказвачите носят, и в почит за своя собственик по целия свят, и в радост за него, за която да му завиждат на Съдния ден. И задълженията в характера са повече от задълженията в богатството и са по-добри от тях при всички положения. Защото богатият е почитан докато е богат, а пропадне ли му богатството става поразен, унизен. А на характера не остаряват новите му черти, нито минават незабелязано неговите достойнства и превъзходството на притежателя му го съпътства и докато е жив и след смъртта му. А богатството е дреха, чийто блясък бързо угасва и чиято тъкан бързо се ръфа. И най-силно пазене се полага на неопетненото целомъдрие и на знатното родословие. И комуто Богът даде прозорливо сърце и искряща мисъл, и добри нрави, и прочута щедрост, и бистър ум, и правилно схващане, и разбиране за промяната на състоянията и произволът на дните и нощите, и език, който да му разкаже за превратностите на времената и който да ползва за всичко, което полза му носи, после възпре душата си от гордост и предпочете доброто общуване пред тиранията, и е малко надменността му при спор, и не провокира опонента си към съперничество, и не предизвиква застаналия на пътя му, в стремеж да го изпревари, и не казва невероятни слова, нито върши прекомерни дела е откупил за себе си похвалата и на присъстващия и на отсъстващия, и е положил за своята полза най-голямо усърдие, и е заслужил възвеличаването на жителите на всички страни, и му се разкриват пътищата на великодушието, и се отстраняват от него порицаните поведения, и го украсяват най-прекрасните имена, и го гледа с възхитен поглед всяко прозорливо око, и е задминал равностойните нему, и признават превъзходството му подобните нему. И за всяко ценно нещо има средство, по което въздишат душите и се нуждаят от него нуждаещите, и се стремят към него устремените. И комуто убегне знанието за него, нараства в душата му почитта му към знаещия и той се издига в очите му според неговата представа, и се опитва да узнае каква е тайната му, и разбира, че степента му е по-висока от неговата. И комуто нарасне делът на раздаденото, и за противника и за поддръжника, според това расте и неговото величие и се издига неговата позиция. И колко от натрупалите богатство щедро раздават, за да постигнат тази степен и да спечелят обич от всички, и да изтрият с това своите недъзи, но не постигат с това желаната цел, нито печелят с похарчените пари хорската почит.","n":29},{"ar":[{"w":359,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"346.1 349.3 335.7 336.4 304.0 309.8 323.4 300.7 291.0 293.6 267.7 283.2 270.3 244.3 244.4 236.6 195.1 219.1 199.0 208.7 220.4 174.4 177.0 158.8 160.8 145.9 148.4 123.8 134.2 126.4 103.7 107.0 82.4 81.7 92.7 69.4 72.0 47.4 57.7 48.7 27.3 30.5 16.9 17.6 4.6\" y=\"47.0 33.4 47.0 26.9 47.0 47.0 47.0 23.0 47.0 33.4 47.0 47.0 51.5 47.0 32.1 47.0 47.0 47.0 38.5 32.1 32.7 47.0 32.1 47.0 25.6 47.0 32.1 47.0 47.0 32.1 47.0 33.4 47.0 28.2 26.2 47.0 33.4 47.0 47.0 30.8 47.0 33.4 47.0 26.9 47.0\"><\/text>"},{"w":318,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"302.5 311.0 301.3 290.2 290.2 279.9 278.6 266.3 268.9 245.5 248.1 233.9 235.2 220.9 223.5 191.8 209.2 199.5 171.0 173.6 159.4 160.6 148.3 150.3 125.7 136.0 127.0 105.6 108.8 85.5 94.6 63.4 71.9 62.2 51.1 53 .4 120.0 118.7 129.1 107.1 109.6 98.6 99.3 74.0 81.8 41.6 61.0 41.6 52.0 28.6 31.2 4.0 17.0 6.6\" y=\"38.8 21.3 38.8 40.7 38.8 38.8 23.9 38.8 38.8 25.2 38.8 16.1 38.8 21.9 38.8 24.5 38.8 42.7 38.8 26.5 15.5 38.8 39.4 38.8 40.1 38.8 23.9 38.8 21.9 14.8 38.8 25.8 38.8 23.9 38.8 21.9 38.8 38.8 9.6 13.5 38.8 23.9 38.8 38.8 25.2\"><\/text>"},{"w":99,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"84.9 87.5 64.8 70.0 44.1 44.1 55.8 16.2 36.3 20.1 8.5\" y=\"38.8 23.9 38.8 23.2 38.8 46.6 20.6 38.8 38.8 23.9 38.8\"><\/text><text font-family=\"zktai192\" font-size=\"32.4\" x=\"0.0\" y=\"38.8\"><\/text>"}],"bg":"И богатият, <b><em>синко мой<\/em><\/b>, е два вида: порицан и похвален. А ученият винаги е ценен и обичан, и сред великите хора броен е, и при беда е взет за опора и признат за свидетел, и след смъртта си е липсващ. И при когото дойде недолюбваното от хората дело, но го приеме с търпение и утеха, печели голяма почит и е похвален и на отвъдния свят и на този. И който се извини пред него (извини се пред наскърбения) за грешните думи и дела против него, а той побърза да го приеме и прояви благосклонност, е разкрил глупостта на хулителя си чрез прошката си и загубата му чрез увеличаването си, и лекомислието му чрез солидността си, и слабоумието му чрез благоразумието си, и нищожността му чрез почтеността си, и несправедливостта му чрез справедливостта си, и безумието му чрез ума си, и прибързаността му чрез отсрочката си. И извиненият завършва с провал своята злина пред него, и му принася най-добри ползи, и го облича с одеждите на възхвалата пред онзи, който не знае за него, и разкрива от достойнството му онова, което е било скрито и за отсъстващия и за присъстващия, и засвидетелства силата и могъществото му чрез унижението си пред него и колениченето си до него, настоятелен в просбата си, като слугата признаващ за грешката си, който е готов да се жертва с търпение и не престава да се покайва пред него до края на времето. За удивление е търсещият прошка, чиято сприпряност му е докарала унижение и чиято грешка му е навлякла дрехата на покорството и смирението, и е дала завинаги власт на простилия му над него, и го е прославила навеки. И понякога се случва човек, който се радва на висока позиция, единствено липсата му на прошка към нанесената обида да пречи хората да се молят на Бога за него всяка сутрин и вечер, и да нарасне почитта му сред тях, и да се издигне степента му в очите им. И ако лошите помисли всеят вражда между човек и близък на него, който цени обичта му и срещу бедите на времето му помага, та реши да скъса връзката с него и го изостави както враг се изоставя, и се опита с предателство и измама да прекрати помощта си към него и да огорчи с това любимите нему, вместо да отблъсне гнева си с доволство и отвръщането си с вярност, и сатанинските помисли със свян, и да възобнови онова, което му се полага от най-чистата искреност и най-истинско братство, и помни добре страданията, на които (близкият му) се е подлагал заради него и нещата, с които го е разсмивал и го е радвал задълго в изтеклите нощи, но въпреки че помни превеса на добрините над грешките, ги потъпче с краката си и не прости на близкия си за грешката му, то той не е от мъдрите хора, нито от устремените към високите степени. И най-скоро ще изпита съжаление, когато близките му се разбягат от него, а времето го нападне безпомощен и самотен. А ако бе изцедил злобата от сърцето си и бе хванал на достойнството пътя, и не бе вършил нещата, които ненавижда другите да вършат със него, щеше злобата му да утихне и живота му да се избистри, и радостта му да е дълга, и покоят му да е много, и обичта към него да укрепне в сърцата, и да се изчистят гърдите му от ненавист, и да се сдобие с превъзходство чрез прошката си, и да се върне при него обичта на близкия му, и да укрепне благодарността му към него. И ако продължи скъперничеството му, ще нарасне безсилието му да постигне целта си и ще му покаже (къде водят) гнева и яда, и ще се просмучат в него тъгата и печалта. (Завърши половината от Книгата на тайните и слава на Бога, Господаря на световете!) И наистина от най-възхвалените хора в техния подход и най-съвършените в тяхната степен, и най-добрите в техните дела, и най-солидните в техния ум е онзи, който отвръща поглед от грешките на свойте побратими и живее в мир с дните на своето време, и съпътства с разбирателство свойте приятели и с честност свойте другари, и е доволен с доброто у другите – колкото имат, и съпровожда всеки от хората според характера му, отпечатан от времето. Защото от най-големите бедствия и най-злите нещастия е да заседне омраза в сърцето ти към онзи, когото ти си обичал и да изгубиш доверие към онзи, на когото ти си разчитал, и да се отчуждиш от онзи, който е бил искрен със теб, а бил ли си тъжен, си намирал утеха при него.","n":30},{"ar":[{"w":312,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"299.1 302.3 277.7 294.6 279.0 267.3 267.3 253.7 255.0 236.2 236.2 228.5 185.0 209.0 188.9 198.6 210.3 168.8 168.2 151.3 155.9 113.1 135.8 111.2 118.3 100.8 102.7 85.9 89.8 63.8 67.1 36.6 59.3 37.9 41.8 16.6 23.0 1.0 5.5\" y=\"44.5 30.9 44.5 44.5 27.0 44.5 21.9 44.5 30.3 44.5 29.6 44.5 44.5 44.5 36.1 29.6 30.3 44.5 15.4 44.5 26.4 44.5 44.5 45.2 18.6 44.5 25.1 44.5 29.6 44.5 30.9 44.5 44.5 33.5 18.6 44.5 30.3 44.5 29.6\"><\/text>"},{"w":306,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"293.0 296.2 280.0 288.4 278.7 267.7 269.6 244.4 251.5 219.1 228.2 202.9 201.6 190.6 191.2 151.0 169.2 184.8 153.0 142.0 142.6 131.6 131.6 111.5 115.4 86.3 93.4 56.5 66.2 37.0 37.0 26.6 25.4 1.4 10.4\" y=\"44.5 30.9 44.5 44.5 20.6 44.5 27.0 44.5 27.7 44.5 30.3 44.5 48.4 44.5 24.4 44.5 44.5 44.5 26.4 44.5 29.0 44.5 21.9 44.5 29.6 44.5 29.0 44.5 48.4 44.5 24.4 44.5 20.6 44.5 53.0\"><\/text>"},{"w":368,"h":63,"svg":"<text font-family=\"zktai190\" font-size= тнет разум, възпрепятствани от доброто обмисляне на последиците, не улучват, нито с поглед, нито с мисъл, нито светските неща, нито отвъдните. И дружи със хората чрез добро съжителство и покрий всеки от тях със завесата на прикритието, и не се доверявай на всеки, та да се окажеш безсилен, и бъди деликатен, внимателен, свръх предпазлив. И дружи с твоя побратим като криеш дефектите му и прощаваш престъпи ли. И не прекалявай с упреците, когато сгреши, и не се отчуждавай от него щом се отдръпне от теб, и не го натоварвай с най-трудните цели, и бъди снизходителен щом се подхлъзне и търпелив щом сгреши. И ако се изпълнят във теб, с истинско знание, чертите на съвършенството, и си сигурен, че не намираш на себе си равен в характера си, не отдавай любовта си изцяло на онзи, който е равнодушен към онова, към което ти не си равнодушен, и смъкни от себе си товара на неговата поддръжка, и се приближавай към него според неговата любов. Защото хората са различни в тяхното поведение и притежават характери невъзможни за съгласуване.","n":32},{"ar":[{"w":354,"h":54,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"344.6 344.6 336.8 294.7 318.7 298.6 308.3 320.0 269.4 269.5 261.7 260.4 244.2 248.7 222.1 230.6 220.9 202.7 209.2 189.8 189.8 172.3 180.7 143.7 153.5 112.0 112.0 123.0 88.0 102.9 91.9 51.7 74.4 53.0 56.9 25.2 44.0 36.8 1.2 7.7\" y=\"36.2 21.3 36.2 36.2 36.2 27.8 21.3 21.9 36.2 16.1 36.2 42.7 36.2 18.1 36.2 36.2 12.2 36.2 15.5 36.2 36.8 36.2 16.1 36.2 40.1 36.2 36.8 18.7 36.2 36.2 36.8 36.2 36.2 25.2 10.3 36.2 36.2 12.2 36.2 37.5\"><\/text><text font-family=\"zktai191\" font-size=\"32.4\" x=\"287.6\" y=\"36.2\"><\/text>"},{"w":365,"h":54,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"352.1 357.9 348.9 339.1 341.7 326.8 327.5 311.3 315.8 288.6 298.9 289.9 260.1 269.8 245.2 244.5 230.3 231.6 212.8 216.7 192.7 198.5 189.4 180.4 182.3 167.4 170.7 144.7 154.4 146.0 138.9 114.9 121.4 87.7 99.4 72.1 71.5 40.4 44.3 3  дело от порицаните дела, дори да се среща често сред хората и да е разпространено много сред другите. Защото заслужава първенец да бъде наречен от всеки онзи, комуто е малко надменността и са добри постъпките му, и е щедър в благодеянията, и е благосклонен към слабия, и гравира в душата си чертите на благородството, и я пази от порицаните нрави. И комуто укрепне великодушието, и се изявят у другите хора благата му, и изчезнат от него, заради въздържанието от страстите на душата му, упреците, се е отличил в надпреварата и е похвален сред хората, и се е откроил от другите, и е придобил съвършенство способът му на действие. И не всеки разумен печели превъзходство чрез разума си, докато не стане способен да носи от своя критик тежката критика. Затова не упреквай разумния с онова, което е тежко за него, нито го натоварвай с онова, което не може да носи. Защото лечението на раните може да изисква предпазване от неща, от които здравите няма нужда да се предпазват. (Защото ранените могат да пламнат от онова, от което здравите не горят.) И нито е истински лекар, нито загрижен приятел, предписващият лекарство непосилно за пациента. И който претендира, че прозира лицата, преди да премине проверка, се е потопил във води, които не са по ръцете му.","n":39},{"ar":[{"w":374,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"364.6 364.6 356.8 313.4 337.4 317.3 327.0 338.7 274.5 290.8 274.6 238.3 266.8 253.8 216.2 218.8 200.7 203.9 178.0 190.3 160.5 163.7 133.9 133.9 121.0 124.2 105.4 108.7 87.9 96.4 65.9 66.5 25.7 53.6 29.0 1.1 7.6 16.6\" y=\"39.5 24.6 39.5 39.5 39.5 31.1 24.6 25.3 39.5 39.5 25.9 39.5 39.5 24.0 39.5 25.9 39.5 24.6 39.5 16.9 39.5 44.1 39.5 19.4 39.5 27.2 39.5 24.6 39.5 20.1 39.5 19.4 39.5 39.5 22.7 39.5 47.3 22.7\"><\/text><text font-family=\"zktai191\" font-size=\"32.4\" x=\"306.3 153.4\" y=\"39.5 39.5\"><\/text>"},{"w":350,"h":63,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"340.6 340.6 316.0 а се радва окото ти. И въпреки това бъди предпазлив, защото дните променят много от хората. И друг, който леко забравя за онзи, който си е отишъл, често зарязва, когато съдбата удари, дълго нехае за болката на приятелите и близките, винаги се държи студено и грубо. Изтекат ли моментите му, свършват се грижите му и застива пламъка му. На този не помрачава безгрижието му безпокойство, нито може да се осланя на верността му човек.","n":40},{"ar":[{"w":331,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"321.6 321.6 313.8 273.0 297.0 276.9 286.6 298.3 246.4 249.7 235.4 238.0 217.9 221.8 203.7 203.7 184.9 188.1 159.6 168.7 146.0 145.4 128.5 131.8 113.6 113.6 90.3 97.4 79.9 79.9 62.4 67.6 36.5 39.7 26.1 26.1 13.8 17.1 1.5 4.1\" y=\"36.1 21.2 36.1 36.1 36.1 27.7 21.2 21.8 36.1 22.5 36.1 21.2 36.1 21.8 36.1 6.9 36.1 21.2 36.1 21.2 36.1 6.9 36.1 17.3 36.1 21.2 36.1 19.9 36.1 13.4 36.1 21.8 36.1 19.3 36.1 13.4 36.1 18.0 36.1 21.2\"><\/text><text font-family=\"zktai191\" font-size=\"32.4\" x=\"265.9\" y=\"36.1\"><\/text>"},{"w":349,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"335.4 339.3 330.2 326.4 310.2 316.6 294.6 299.1 282.9 284.2 269.3 268.0 249.2 259.6 213.6 236.3 214.2 218.8 192.9 195.5 203.2 163.7 187.7 170.2 140.4 147.5 127.4 130.7 119.6 119.6 107.3 109.9 90.5 90.5 79.5 78.8 70.4 71.0 47.1 54.2 27.0 30.9 1.7 8.2\" y=\"36.1 22.5 36.1 15.4 36.1 21.8 36.1 20.6 36.1 19.3 36.1 40.0 36.1 12.1 36.1 36.1 20.6 10.2 36.1 21.8 19.9 36.1 36.1 37.4 36.1 21.8 36.1 23.8 36.1 16.0 36.1 21.2 36.1 16.0 36.1 12.1 36.1 22.5 36.1 19.9 36.1 21.2 36.1 42.6\"><\/text>"},{"w":350,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"335.3 343.7 334.0 315.9 316.5 302.9 306.2 286.1 298.4 288.7 266.6 269.9 250.4 250.4 257.6 238.1 238.1 220.6 227.8 194.7 194.1 172.7 185.6 175.3 148.0 164.9 150.0 135.7 137.7 113.1 123.4 114.4 93.6 96.9 85.2 85.8 58.0 77.4 70.  у когото едното от тях е заложено по природа, другото успява да го догони. А у когото едното от тях липсва напълно, скоро и другото го напуска. И който смекчи хватката си към грубия, и стори лицето си приветливо за учтивия, и предаде юздата си на доброжелателя, се е издигнал във висините на почитта, и на помощта му разчитат при големи дела, и е спечелил похвала и от онзи, с който е в разногласие и от онзи, с който е в единогласие.","n":42},{"ar":[{"w":367,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"357.6 357.6 349.8 309.0 333.0 312.9 322.6 334.3 290.2 292.2 281.2 281.8 268.8 270.8 257.2 259.8 246.8 246.2 224.8 233.2 223.5 212.5 215.7 200.8 202.1 185.3 193.7 149.6 172.3 150.9 154.8 136.0 137.3 109.4 126.9 117.9 90.0 93.2 84.8 84.2 61.5 68.0 40.8 42.0 49.8 1.2 10.9 20.0\" y=\"36.7 21.8 36.7 36.7 36.7 28.2 21.8 22.4 36.7 16.6 36.7 21.1 36.7 21.8 36.7 23.1 36.7 36.7 36.7 36.7 12.7 36.7 18.5 36.7 22.4 36.7 14.0 36.7 36.7 25.7 10.8 36.7 38.6 36.7 36.7 16.6 36.7 23.1 36.7 7.5 36.7 20.5 36.7 21.1 41.2 36.7 12.0 16.6\"><\/text>"},{"w":373,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"359.8 360.4 350.7 353.9 329.3 337.1 312.5 313.8 300.2 302.1 280.1 286.6 255.5 263.2 225.0 232.8 204.3 206.9 214.6 168.6 191.3 169.9 173.8 148.5 160.8 147.9 137.5 141.4 108.3 124.6 108.4 115.5 96.0 97.3 85.7 85.7 58.5 74.0 61.1 38.4 41.6 17.0 1.4 30.0\" y=\"36.7 16.6 36.7 36.7 36.7 19.8 36.7 19.2 36.7 17.2 36.7 22.4 36.7 19.8 36.7 21.8 36.7 22.4 20.5 36.7 36.7 25.7 10.8 36.7 36.7 45.1 36.7 34.1 36.7 36.7 25.7 12.0 36.7 21.1 36.7 14.0 36.7 36.7 41.2 36.7 23.1 36.7 36.7 36.7\"><\/text>"},{"w":293,"h":60,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"279.3 281.9 261.9 265.7 242.4 245.0 215.2 234.0 220.4 185.4 186.7 192.5 158.2 177.6 162.1 149.1 147.8 136.8 136.1 123.2 122.5 108.3 109.6 85.6 97.9 70.7 68.1 54.5 62.9 53.2 35.1 38.3 26.0 24.7 4.6 5.2\"  нрави, и бързай с нейните хора натам, накъдето бързат и тичат. Така ще опазиш честта си и земята ще се простре пред краката ти, и ще се спазва твоето одобрение и отхвърляне, и ще се крие от теб онзи, който те мрази. И не таи злоба към твоите връстници, и да не те подтикнат споровете в отсъжданията към вражда с мъдреците, защото препирнята може да доведе до омраза и да извади наяве скритото у твоя любимец. (Завърши третата четвърт от Книгата на тайните и слава на Бога, Господаря на световете.) И приеми наставлението на онзи, който те дари с наставлението си, и не загърбвай здравия разум, и прояви търпение към бедите на сърцето, и се откъсни от онова, с което си привикнал, за да спечелиш чрез онова, което е ново за теб, и да хванеш душата си за юздите ѝ така, както се хваща ездитния кон, и дефектите ти да бъдат пред теб, а ти да ги гледаш с ненавист, та да привикнеш към дружеското отношение, което ти е повелено. И пази се на онова, което не обичаш у другите, да не бъдеш носител, та пред хората да бъдеш охулен. И не преставай да поправяш порицаното у теб от другите, като го избягваш докато ти е писано да живееш.","n":48},{"ar":[{"w":329,"h":53,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"319.6 319.6 311.8 271.0 295.0 274.9 284.6 296.3 247.0 247.0 239.3 238.0 221.8 225.0 197.8 200.4 178.4 181.6 165.4 166.7 143.4 151.8 119.4 122.0 101.9 106.4 72.1 88.9 75.3 62.4 59.8 49.4 48.8 26.1 34.5 0.2 8.6 1.5 18.3\" y=\"36.1 21.2 36.1 36.1 36.1 27.7 21.2 21.9 36.1 16.1 36.1 42.6 36.1 17.4 36.1 19.9 36.1 21.2 36.1 21.9 36.1 19.9 36.1 19.9 36.1 45.9 36.1 36.1 20.6 36.1 37.4 36.1 19.9 36.1 21.2 36.1 36.1 36.1 36.1\"><\/text><text font-family=\"zktai191\" font-size=\"32.4\" x=\"263.9\" y=\"36.1\"><\/text>"},{"w":265,"h":53,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"254.6 254.6 234.5 238.4 217.0 224.2 202.8 199.5 190.5 189.8 175.5 173.0 151.6 167.8 151.6 131.5 135.4 121.1 121.1 103.6 108.2 78.3 81.6 60.9 64.7 32. ните, които дните нанасят и нищожната жалост, която към почтените проявяват, и огромната настоятелност, с която жертвите им душите си порицават.","n":50},{"ar":[{"w":291,"h":54,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"278.1 281.3 256.7 273.6 258.0 246.3 246.3 232.7 234.0 216.5 216.5 208.8 166.6 190.6 170.5 180.2 191.9 151.7 151.1 134.2 138.8 103.8 114.1 120.0 103.8 94.7 94.1 77.9 85.6 57.1 60.4 36.4 52.6 36.4 24.1 26.7 4.0 16.3 6.6\" y=\"35.8 22.2 35.8 35.8 18.3 35.8 13.1 35.8 21.5 35.8 20.9 35.8 35.8 35.8 27.4 20.9 21.5 35.8 6.6 35.8 17.6 35.8 35.8 35.8 12.5 35.8 20.9 35.8 15.7 35.8 22.2 35.8 35.8 22.2 35.8 21.5 35.8 35.8 22.2\"><\/text>"},{"w":323,"h":54,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"311.8 313.8 302.8 302.1 290.5 293.7 277.5 277.5 257.4 263.9 232.1 249.6 235.4 214.0 214.6 200.4 203.0 173.2 184.8 155.7 157.6 143.4 145.3 121.3 131.7 122.6 98.0 115.5 101.2 77.2 80.5 68.8 66.2 38.4 61.1 39.7 43.6 18.3 24.8 0.8 5.3\" y=\"35.8 21.5 35.8 18.9 35.8 17.6 35.8 44.2 35.8 18.9 35.8 35.8 40.3 35.8 15.7 35.8 22.2 35.8 11.8 35.8 21.5 35.8 20.9 35.8 35.8 18.9 35.8 35.8 40.3 35.8 22.2 35.8 44.2 35.8 35.8 24.8 9.9 35.8 21.5 35.8 45.5\"><\/text>"},{"w":355,"h":54,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"342.0 345.3 329.1 337.5 327.8 317.4 320.0 308.4 307.1 281.8 299.3 287.0 263.6 265.6 250.7 253.3 237.7 241.0 215.7 233.2 218.9 195.0 198.2 165.2 174.9 184.0 130.2 134.7 137.9 147.0 98.4 106.2 86.1 86.1 65.4 68.0 44.6 47.9 33.6 36.9 24.5 23.2 4.5 6.4\" y=\"35.8 22.2 35.8 35.8 11.8 35.8 17.6 35.8 41.6 35.8 35.8 36.4 35.8 21.5 35.8 22.2 35.8 22.8 35.8 35.8 40.3 35.8 22.2 35.8 11.2 15.7 35.8 42.9 13.1 13.8 35.8 20.9 35.8 37.1 35.8 45.5 35.8 22.2 35.8 13.1 35.8 41.6 35.8 45.5\"><\/text>"},{"w":58,"h":54,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"49.5 48.9 37.9 38.5 25.6 27.5 1.6 1  36.8 18.7 36.2 36.2 36.8 36.2 36.2 7.0 10.9 36.2 21.2 36.2 36.2 44.6\"><\/text><text font-family=\"zktai192\" font-size=\"32.4\" x=\"-0.6\" y=\"36.2\"><\/text>"}],"bg":"<b><em>Синко мой<\/em><\/b>, украси себе си като оставиш просията, додето имаш необходимото, колкото и да е малко, защото за всеки ден, който прекарваш има препитание, което ти е отредено, а настойчивото искане е дело порицано и достойното излъчване е невъзможно със него. И е без благородство онзи, чието търпение не взема победа и чиято надежда не го съпровожда. Затова запаси душата си със доволство от онова, с което ситуацията те е снабдила, та дори да е малко, защото то е от качествата на достойните хора, докато се затворят за теб вратите на затруднението и се разтворят за теб, с обичаното от теб, вратите на улеснението. И защото доволният дарен е от Бога с подкрепа, и на този свят и на отвъдния, а способният да чака е достоен да получи своята нужда и от Бога да бъде дарен с най-висшите си стремежи, и да се радва задълго на помощта и издръжката му. И може нетърпеливият, скоро време и с малко чакане, помощ да види. Но може и Богът да възпита своя слуга чрез бедност и да го подложи на трудност за изпитание, та скоро след него с най-отбраното да го дари, и споменаването му с божието благополучие да извиси, и той да е доволен от него през цялото време. Затова не посягай към плод, който не е узрял, нито се стреми към нужда, която не е назряла, защото ти ще вкусиш сладостта на плода във сезона му и ще се сдобиеш със своята нужда, когато настъпи момента ѝ. А онзи, който сам устройва свойте творенията, знае най-добре подходящите сроковете за тяхното благоденствие. Затова се допитай до Най-деликатния и Най-запознатия, та да избере най-доброто за теб във всичките ти дела.","n":56},{"ar":[{"w":337,"h":59,"svg":"<text font-family=\"zktai190\" font-size=\"32.4\" x=\"327.6 327.6 319.8 277.7 301.7 281.6 291.3 303.0 249.8 253.1 231.1 242.7 202.5 201.3 211.6 190.2 192.2 173.4 176.6 140.4 159.1 143. <script>function ZKU(el,o){if(o&&o.svg){el.classList.add('zsv');el.innerHTML='<svg viewBox="0 0 '+o.w+' '+o.h+'" aria-hidden="true">'+o.svg+'</svg>';return 'none';}return 'url(data:image/png;base64,'+o.b64+')';}
</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const items=D.items;
const AR_K=0.6, AR_FK=0.72;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const mem={};
const store={
  get(k){try{const v=localStorage.getItem('maknun:'+k);if(v!=null)return JSON.parse(v);}catch(e){} return mem[k];},
  set(k,v){mem[k]=v;try{localStorage.setItem('maknun:'+k,JSON.stringify(v));}catch(e){}}
};
function arEl(a,k,label){
  const d=document.createElement('div');
  d.className='arimg';d.setAttribute('role','img');if(label)d.setAttribute('aria-label',label);
  const u=ZKU(d,a);
  d.style.webkitMaskImage=u;d.style.maskImage=u;
  d.style.aspectRatio=a.w+' / '+a.h;
  d.style.width='calc('+(a.w*k).toFixed(1)+'px * var(--s-ar))';
  return d;
}

/* ---------- build ---------- */
const R=$('#reader');
function sec(id,title,lede){const s=document.createElement('section');s.className='sec';s.id=id;s.innerHTML='<h2>'+title+'</h2>'+(lede?'<p class="lede">'+lede+'</p>':'');R.appendChild(s);return s;}
function flowEl(chs,k){const f=document.createElement('div');f.className='arflow';f.setAttribute('lang','ar');chs.forEach(c=>f.appendChild(arEl(c,k,null)));return f;}
const idOf=i=>items[i].n?'p'+items[i].n:'intro';
items.forEach((it,i)=>{const p=it.bg.replace(/<[^>]+>/g,'').replace(/^\(?\s*/,'');it.label=p.length>44?p.slice(0,42).replace(/\s+\S*$/,'')+'…':p;});
const label=it=>(it.n?it.n+'. ':'Встъпление. ')+it.label;
function itemEl(it,i){
  const a=document.createElement('article');a.className='item';a.id=idOf(i);a.dataset.i=i;
  a.innerHTML='<div class="num"><a href="#'+idOf(i)+'">'+(it.n||'')+'</a></div><div class="body"><div class="ar"></div><p class="bg">'+it.bg+'</p></div>';
  a.querySelector('.ar').appendChild(flowEl(it.ar,AR_K));return a;
}
const S=sec('book','Книгата на тайните','Встъплението и '+(items.length-1)+' наставления на имам ал-Касим ибн Ибрахим към сина му. Всеки абзац е на арабски, а под него е преводът.');
items.forEach((it,i)=>S.appendChild(itemEl(it,i)));
/* hero */

const toc=[['intro','Встъпление',''],['p1','Наставленията',(items.length-1)+' абзаца']];
$('#toc').innerHTML=toc.map(t=>'<li><a href="#'+t[0]+'">'+t[1]+'<span>'+t[2]+'</span></a></li>').join('');
const grid=$('#grid');
items.forEach((it,i)=>{grid.insertAdjacentHTML('beforeend','<a href="#'+idOf(i)+'" data-i="'+i+'" title="'+esc(label(it))+'">'+(it.n||'В')+'</a>');});
const J=$('#jump');
let opts='<option value="top">Начало</option>';
items.forEach((it,i)=>{opts+='<option value="'+idOf(i)+'">'+esc(label(it))+'</option>';});
J.innerHTML=opts;
J.addEventListener('change',()=>{const el=document.getElementById(J.value);if(el)el.scrollIntoView();});

/* ---------- settings ---------- */
const panel=$('#panel'),setBtn=$('#setBtn');
setBtn.onclick=e=>{e.stopPropagation();const o=panel.classList.toggle('open');setBtn.setAttribute('aria-expanded',o);};
document.addEventListener('click',e=>{if(panel.classList.contains('open')&&!panel.contains(e.target)&&e.target!==setBtn){panel.classList.remove('open');setBtn.setAttribute('aria-expanded',false);}});
const opt=Object.assign({ar:true,tr:true,bg:true,x:true},store.get('opt')||{});
function applyOpt(){
  document.body.classList.toggle('noar',!opt.ar);document.body.classList.toggle('notr',!opt.tr);
  document.body.classList.toggle('nobg',!opt.bg);document.body.classList.toggle('nox',!opt.x);
}
document.querySelectorAll('[data-opt]').forEach(c=>{c.checked=opt[c.dataset.opt];c.onchange=()=>{opt[c.dataset.opt]=c.checked;store.set('opt',opt);applyOpt();};});
applyOpt();
const sz=Object.assign({ar:2,tr:0,bg:0},store.get('sz')||{});
function applySz(){document.querySelectorAll('.step').forEach(s=>{const k=s.dataset.k;s.querySelector('output').textContent=Math.round((1+sz[k]*0.1)*100)+'%';document.documentElement.style.setProperty('--s-'+k,(1+sz[k]*0.1).toFixed(2));});}
document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const k=b.closest('.step').dataset.k;sz[k]=Math.max(-4,Math.min(8,sz[k]+ +b.dataset.d));store.set('sz',sz);applySz();});
applySz();
let theme=store.get('theme')||'auto';
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===theme));}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{theme=b.dataset.t;store.set('theme',theme);applyTheme();});
applyTheme();

/* ---------- position memory ---------- */
let curI=-1;
const arts=[...document.querySelectorAll('.item')];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setCur(+e.target.dataset.i,false);});},{rootMargin:'-30% 0px -60% 0px'});
arts.forEach(a=>io.observe(a));
const io2=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&document.activeElement!==J)J.value=e.target.parentElement.id;});},{rootMargin:'-20% 0px -70% 0px'});

function setCur(i,mark){
  curI=i;store.set('pos',i);
  grid.querySelectorAll('a.cur').forEach(a=>a.classList.remove('cur'));
  const g=grid.querySelector('a[data-i="'+i+'"]');if(g)g.classList.add('cur');
  if(document.activeElement!==J)J.value=idOf(i);
  if(mark)arts.forEach(a=>a.classList.toggle('cur',+a.dataset.i===i));
}
const saved=store.get('pos');
const rb=$('#resumeBtn');
if(typeof saved==='number'&&saved>0&&items[saved]){rb.hidden=false;rb.textContent='Продължи от абзац '+items[saved].n;rb.onclick=()=>document.getElementById(idOf(saved)).scrollIntoView();}

/* ---------- focus mode ---------- */
const F={open:false,i:0};
const fb=$('#fBody');
function renderF(){
  const it=items[F.i];
  $('#fWhere').textContent=it.n?'Абзац '+it.n+' от '+(items.length-1):'Встъпление';
  $('#fProg').style.width=((F.i+1)/items.length*100)+'%';
  fb.innerHTML='<div class="fnum">'+(it.n?'№ '+it.n:'Встъпление')+'</div><div class="ar"></div><p class="bg">'+it.bg+'</p>';
  fb.querySelector('.ar').appendChild(flowEl(it.ar,AR_FK));
  $('#fPrev').disabled=F.i===0;
  $('#fNext').textContent=F.i===items.length-1?'Край':'Напред';
  fb.scrollTop=0;
  setCur(F.i,false);
}
function openF(i){F.open=true;F.i=Math.max(0,i);$('#focus').classList.add('open');document.body.style.overflow='hidden';renderF();}
function closeF(){F.open=false;$('#focus').classList.remove('open');document.body.style.overflow='';const el=document.getElementById(idOf(F.i));if(el){el.scrollIntoView({block:'start'});setCur(F.i,true);}}
$('#focusBtn').onclick=()=>openF(curI>=0?curI:0);
$('#fClose').onclick=closeF;
$('#fPrev').onclick=()=>{if(F.i>0){F.i--;renderF();}};
$('#fNext').onclick=()=>{if(F.i<items.length-1){F.i++;renderF();}else closeF();};
document.addEventListener('keydown',e=>{
  if(!F.open)return;
  if(e.key==='Escape')closeF();
  else if(e.key==='ArrowRight'||e.key==='PageDown')$('#fNext').click();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')$('#fPrev').click();
});
let tx=null,ty=null;
fb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
fb.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?$('#fNext').click():$('#fPrev').click();}});
})();

</script>
<script id="zk-nav-js">
(function(){
  var a=document.getElementById('zkHome'), hero=document.getElementById('top');
  if(!a||!hero) return;
  var t=document.querySelector('.bar-title'), name=(t&&t.textContent.trim())||document.title;
  var lab=a.querySelector('span'), ic=a.querySelector('svg');
  var HOME=ic.innerHTML, BOOK='<path d="M5 5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0-2 2z"/><path d="M5 19a2 2 0 0 0 2 2h12v-4"/>';
  function set(atStart){
    if(atStart){a.href='index.html';lab.textContent='Зикирь';ic.innerHTML=HOME;a.title='Зикирь – начална страница';}
    else{a.href='#top';lab.textContent=name;ic.innerHTML=BOOK;a.title=name+' – към началото';}
  }
  function check(){var r=hero.getBoundingClientRect();set(r.bottom>80);}
  check();
  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check);
  window.addEventListener('hashchange',function(){setTimeout(check,50);});
})();
</script>
<script id="zk-find">var ZK={
 SEL:'p,li,h2,h3,h4,.bg,.tr,span.ay,details.src,dd,dt,blockquote,td',
 EX:'.bar,.panel,.focus,.toc,.grid,nav,header,#top,footer,select,button,label,[role=dialog],.zk-ver,.inst,script,style,svg',
 blocks:function(){var S=ZK.SEL,E=ZK.EX;return Array.prototype.filter.call(document.querySelectorAll(S),function(e){return !e.closest(E)&&!(e.parentElement&&e.parentElement.closest(S));});},
 text:function(e){var w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentElement.closest('svg,script,style')?2:1;}}),n,o='',pb=null;while(n=w.nextNode()){var bk=n.parentElement;while(bk!==e&&/^inline/.test(getComputedStyle(bk).display))bk=bk.parentElement;if(pb&&bk!==pb)o+=' ';pb=bk;o+=n.nodeValue;}return o.replace(/[-]/g,'').replace(/\s+/g,' ').trim();},
 DROP:/[’‘'`ʼʻʿʾ´­\-‐‑–]/,
 norm:function(s,wantMap){var o='',m=wantMap?[]:null,sp=true;for(var i=0;i<s.length;i++){var c=s[i];if(ZK.DROP.test(c))continue;
   if(/\s/.test(c)){if(!sp){o+=' ';m&&m.push(i);sp=true;}continue;}
   var l=c.toLowerCase();if(l!=='й'&&l!=='ё'){l=l.normalize('NFD').replace(/[̀-ͯ]/g,'');}if(l==='ı')l='i';else if(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/.test(l))continue;else if(/[أإآٱ]/.test(l))l='ا';else if(l==='ى')l='ي';else if(l==='ة')l='ه';
   for(var k=0;k<l.length;k++){o+=l[k];m&&m.push(i);}sp=false;}
  return wantMap?{n:o,m:m}:o;}
};
(function(){
  var q=new URLSearchParams(location.search), qq=q.get('zkq'), bi=q.get('zkb');
  if(qq===null||bi===null) return;
  try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}
  var st=document.createElement('style');
  st.textContent='mark.zk-m{background:color-mix(in srgb,var(--gold,#c90) 38%,transparent);color:inherit;border-radius:2px;padding:0 1px}'+
    '.zk-hit{animation:zkhit 4.5s ease-out 1}@keyframes zkhit{0%,40%{background:color-mix(in srgb,var(--gold,#c90) 16%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold,#c90) 16%,transparent)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}';
  document.head.appendChild(st);
  var words=ZK.norm(qq).split(' ').filter(Boolean), user=false, target=null;
  ['wheel','touchstart','keydown','mousedown'].forEach(function(t){addEventListener(t,function(){user=true;},{passive:true,once:true});});
  function find(){
    var bs=ZK.blocks(), e=bs[+bi];
    var ok=function(x){if(!x)return false;var n=ZK.norm(ZK.text(x));return words.every(function(w){return n.indexOf(w)>=0;});};
    if(!ok(e)){e=null;for(var i=0;i<bs.length;i++){if(ok(bs[i])){e=bs[i];break;}}}
    return e;
  }
  function mark(e){
    var w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentElement.closest('svg,script,style,mark')?2:1;}}),ns=[],n;
    while(n=w.nextNode())ns.push(n);
    ns.forEach(function(t){var r=ZK.norm(t.nodeValue,true),hits=[];
      words.forEach(function(wd){var p=0;while((p=r.n.indexOf(wd,p))>=0){hits.push([r.m[p],r.m[p+wd.length-1]+1]);p+=wd.length;}});
      if(!hits.length)return;hits.sort(function(a,b){return a[0]-b[0];});
      var f=document.createDocumentFragment(),pos=0,s=t.nodeValue;
      hits.forEach(function(h){if(h[0]<pos)return;f.appendChild(document.createTextNode(s.slice(pos,h[0])));var mk=document.createElement('mark');mk.className='zk-m';mk.textContent=s.slice(h[0],h[1]);f.appendChild(mk);pos=h[1];});
      f.appendChild(document.createTextNode(s.slice(pos)));t.parentNode.replaceChild(f,t);});
  }
  function show(){
    if(!target) return;
    for(var d=target.parentElement;d;d=d.parentElement){if(d.tagName==='DETAILS'&&!d.open)d.open=true;}
    if(target.tagName==='DETAILS')target.open=true;
    var v=target;while(v&&v!==document.body&&!v.getClientRects().length)v=v.parentElement;
    var mk=target.querySelector('mark.zk-m');
    if(mk&&mk.getClientRects().length&&v===target)mk.scrollIntoView({block:'center'});else (v||target).scrollIntoView({block:'center'});
  }
  function go(){
    target=find(); if(!target) return;
    mark(target); target.classList.add('zk-hit'); show();
    [350,900,1700].forEach(function(t){setTimeout(function(){if(!user)show();},t);});
  }
  if(document.readyState==='complete')setTimeout(go,60);else addEventListener('load',function(){setTimeout(go,60);});
})();
</script>
