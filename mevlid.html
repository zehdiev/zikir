<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мевлид-и Шериф</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F8F8F5; --sheet:#FFFFFF; --ink:#1B2030; --muted:#5E6474; --lapis:#21406A; --gold:#9C7A33; --rule:#E2E0D8; --refrain:#F3EFE3;
  --ar-filter:none;
  --s-ar:1; --s-tr:1; --s-bg:1;
  --serif:"Alegreya", "PT Serif", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "PT Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151E; --sheet:#171C27; --ink:#E9E6DD; --muted:#A3A7B3; --lapis:#9DB9E0; --gold:#D3B46B; --rule:#2A3040; --refrain:#1D2230;
    --ar-filter:invert(1);
  }
}
:root[data-theme="dark"]{
  --paper:#11151E; --sheet:#171C27; --ink:#E9E6DD; --muted:#A3A7B3; --lapis:#9DB9E0; --gold:#D3B46B; --rule:#2A3040; --refrain:#1D2230;
  --ar-filter:invert(1);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); -webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--sans)}
.bar-title{font-family:var(--serif);font-weight:500;font-size:17px;white-space:nowrap;margin-right:auto;color:var(--ink);text-decoration:none}
.sel{appearance:none;-webkit-appearance:none;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 30px 7px 10px;font:500 15px var(--sans);color:var(--ink);max-width:46vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* settings panel */
.panel{max-height:calc(100vh - 80px);overflow:auto;position:fixed;z-index:20;right:max(12px,calc((100vw - 880px)/2 + 12px));top:calc(env(safe-area-inset-top,0px) + 60px);width:min(320px,calc(100vw - 24px));background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;font-family:var(--sans);box-shadow:0 12px 40px rgba(10,15,30,.18);display:none}
.panel.open{display:block}
.panel h3{margin:0 0 8px;font:500 14px var(--sans);color:var(--muted)}
.panel .grp+ .grp{margin-top:16px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:16px;cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:12px;background:var(--rule);position:relative;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--sheet);transition:transform .15s}
.tog input:checked{background:var(--lapis)}
.tog input:checked::after{transform:translateX(17px)}
.step{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:16px}
.step .ctl{display:flex;align-items:center;gap:6px}
.step .ctl button{width:34px;height:32px;border-radius:8px;border:1px solid var(--rule);background:transparent;cursor:pointer;font-size:18px;line-height:1}
.step .ctl button:disabled{opacity:.35;cursor:default}
.step .ctl output{min-width:44px;text-align:center;font-size:14px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:7px 0;border:0;background:transparent;cursor:pointer;font-size:15px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--sheet)}

/* hero */
.hero{max-width:880px;margin:0 auto;padding:56px 20px 32px;text-align:center}
.arch{width:120px;height:auto;color:var(--gold)}
.hero h1{font-weight:400;font-size:clamp(44px,10vw,76px);line-height:1;margin:18px 0 10px;letter-spacing:.01em}
.hero p{margin:0 auto;color:var(--muted);font-size:18px;max-width:34ch}
.cta{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-family:var(--sans)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--lapis);background:var(--lapis);color:var(--sheet);font:500 16px var(--sans);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--lapis)}
.toc{max-width:520px;margin:36px auto 0;padding:0;list-style:none;text-align:left;font-family:var(--sans)}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:17px}
.toc a span{color:var(--muted);font-size:15px}@media (hover:hover){.toc a:hover span{color:var(--gold)}}

/* reading */
main{max-width:880px;margin:0 auto;padding:0 16px 80px}
.sec-h{text-align:center;padding:64px 0 28px}
.sec-h .orn{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--gold)}
.sec-h .orn::before,.sec-h .orn::after{content:"";height:1px;flex:0 1 120px;background:currentColor;opacity:.6}
.sec-h h2{font-weight:400;font-size:clamp(30px,6vw,42px);margin:14px 0 0;line-height:1.1}
.sec-h .n{display:block;font:500 15px var(--sans);color:var(--muted);margin-top:8px}

.beyt{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:4px 4px 4px 4px;padding:16px 16px 14px 40px;margin:0 0 10px;scroll-margin-top:72px}
.beyt .num{position:absolute;left:8px;top:20px;font:500 13px var(--sans);color:var(--muted);width:26px;text-align:center}
.beyt.refrain{background:var(--refrain);border-color:color-mix(in srgb,var(--gold) 45%,var(--rule))}
.beyt.refrain .num{color:var(--gold)}
.beyt.cur{border-color:var(--lapis)}
.hems{display:grid;gap:14px}
.hem{min-width:0}
.ar{display:flex;justify-content:flex-end;margin:0 0 6px}
.ar img{display:block;filter:var(--ar-filter);height:auto}
.tr{font-size:calc(21px * var(--s-tr));font-weight:500;line-height:1.35}
.bg{font-size:calc(17px * var(--s-bg));font-style:italic;color:var(--muted);line-height:1.45;margin-top:2px}
.center{text-align:center;padding:22px 16px;margin:6px 0 12px}
.center .ar{justify-content:center}
.center .tr{font-size:calc(20px * var(--s-tr))}
.hide-ar .ar,.hide-tr .tr,.hide-bg .bg{display:none}

@media (min-width:760px){
  .hems{grid-template-columns:1fr 1fr;gap:28px}
  .beyt{padding:20px 26px 18px 58px}
  .ar{justify-content:center}
  .hem .tr,.hem .bg{text-align:center}
  .rtl .beyt .hem:first-child{order:2}
}
.beyt .num{} @media (max-width:479px){.bar-title{display:none}.sel{max-width:none;flex:1}}
@media (min-width:760px){.beyt .num{left:16px}}
.endnote{text-align:center;color:var(--muted);font-family:var(--sans);font-size:15px;padding:40px 0 0}

/* focus mode */
.focus{position:fixed;inset:0;z-index:30;background:var(--paper);display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.focus.open{display:flex}
.f-top{display:flex;align-items:center;gap:10px;padding:10px 16px;font-family:var(--sans);border-bottom:1px solid var(--rule)}
.f-top .where{margin-right:auto;font-size:15px;color:var(--muted)}
.f-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.f-card{width:100%;max-width:640px;text-align:center}
.f-card .hem+.hem{margin-top:34px}
.f-card .ar{justify-content:center}
.f-card .tr{font-size:calc(28px * var(--s-tr))}
.f-card .bg{font-size:calc(19px * var(--s-bg))}
.f-card.refrain .tr{color:var(--gold)}
.f-nav{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--rule);font-family:var(--sans)}
.f-nav button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);font-size:17px;font-weight:500;cursor:pointer}
.f-nav button.next{background:var(--lapis);border-color:var(--lapis);color:var(--sheet)}
.f-nav button:disabled{opacity:.4;cursor:default}
.prog{height:3px;background:var(--rule)}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.ar .art{margin:0;width:100%;font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:400;font-style:normal;font-size:calc(28px * var(--s-ar));line-height:1.85;text-align:right;direction:rtl;color:var(--ink);overflow-wrap:break-word}.f-card .ar .art{font-size:calc(32px * var(--s-ar))}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зикирь">
<script>try{var zt=localStorage.getItem('zk:theme');if(zt==='light'||zt==='dark')document.documentElement.setAttribute('data-theme',zt);}catch(e){}</script>
<style id="zk-nav">.bar-in .bar-title{display:none}.zk-home{flex:0 1 auto;min-width:0;max-width:min(52vw,340px);display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}.zk-home span{overflow:hidden;text-overflow:ellipsis}.zk-home svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media (hover:hover){.zk-home:hover,.zk-flag:hover{border-color:var(--gold)}}.zk-flag{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet)}.zk-flag svg{width:24px;height:16px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}.bar-in .sel{flex:1 1 0;min-width:0}@media (max-width:479px){.bar-in .sel{max-width:none;min-width:84px}.zk-home{max-width:40vw}}.zk-alt{color:var(--ink)}.zk-alt svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;box-shadow:none;border-radius:0}.zk-ver{display:grid;justify-items:center;gap:8px;margin:22px auto 0;font-family:var(--sans)}.zk-ver small{font-size:13px;color:var(--muted);letter-spacing:.04em}.zk-seg{display:inline-flex;border:1px solid var(--deep);border-radius:999px;overflow:hidden}.zk-seg a,.zk-seg span{padding:8px 16px;font-size:15px;font-weight:500;text-decoration:none;color:var(--deep)}.zk-seg span{background:var(--deep);color:var(--paper)}@media (hover:hover){.zk-seg a:hover{background:color-mix(in srgb,var(--deep) 12%,transparent)}}.zk-ver p{margin:0;font-size:14px;color:var(--muted);max-width:40ch;text-align:center}main p,main li{overflow-wrap:break-word}</style>
<style id="zk-touch">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,label,select,summary,input,output,[role=button],.chip{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
.panel,#panel,#zkPanel{max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@supports (height:100dvh){.panel,#panel,#zkPanel{max-height:calc(100dvh - 80px - env(safe-area-inset-top,0px))}}
@media (pointer:coarse){
 .ib,.zk-home,.zk-flag,.ctl button,.setb,.savb,.sin{position:relative}
 .ib::before,.zk-home::before,.zk-flag::before,.ctl button::before,.zk-star::before,.setb::before,.savb::before,.sin::before{content:"";position:absolute;inset:-6px}
 .ctl button{width:44px;height:40px}
 .seg button{min-height:44px}
 .tog{min-height:44px}
 select.sel,.sel{min-height:40px}
 .chip{min-height:38px}
 sup a{display:inline-block;padding:10px 8px;margin:-10px -8px}
 summary{padding-top:8px;padding-bottom:8px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="zk-home" id="zkHome" href="index.html" title="Зикирь – начална страница"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg><span>Зикирь</span></a>
    <a class="bar-title" href="#top">Мевлид-и Шериф</a>
    <select class="sel" id="jump" aria-label="Към бахир"></select>
    <button class="ib" id="focusBtn" aria-label="Четене бейт по бейт" title="Бейт по бейт">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 12h6M13 9.5 15.5 12 13 14.5"/></svg>
    </button>
    <a class="zk-flag" href="mevlid_tr.html" aria-label="Türkçe" title="Türkçe"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#E30A17"/><circle cx="10.5" cy="10" r="5" fill="#fff"/><circle cx="11.75" cy="10" r="4" fill="#E30A17"/><polygon fill="#fff" points="13.90,10.00 15.59,9.41 15.63,7.62 16.71,9.05 18.42,8.53 17.40,10.00 18.42,11.47 16.71,10.95 15.63,12.38 15.59,10.59"/></svg></a>
    <button class="ib" id="setBtn" aria-label="Настройки" aria-expanded="false" title="Настройки">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<div class="panel" id="panel" role="dialog" aria-label="Настройки">
  <div class="grp">
    <h3>Показвай</h3>
    <label class="tog">Арабски текст <input type="checkbox" id="optAr" checked></label>
    <label class="tog">Транскрипция <input type="checkbox" id="optTr" checked></label>
    <label class="tog">Превод <input type="checkbox" id="optBg" checked></label>
  </div>
  <div class="grp">
    <h3>Размер на шрифта</h3>
    <div class="step" data-k="sar">Арабски текст <span class="ctl"><button data-d="-1" aria-label="По-малък арабски текст">−</button><output></output><button data-d="1" aria-label="По-голям арабски текст">+</button></span></div>
    <div class="step" data-k="str">Транскрипция <span class="ctl"><button data-d="-1" aria-label="По-малка транскрипция">−</button><output></output><button data-d="1" aria-label="По-голяма транскрипция">+</button></span></div>
    <div class="step" data-k="sbg">Превод <span class="ctl"><button data-d="-1" aria-label="По-малък превод">−</button><output></output><button data-d="1" aria-label="По-голям превод">+</button></span></div>
  </div>
  <div class="grp">
    <h3>Първи полустих</h3>
    <div class="seg" id="orderSeg">
      <button data-o="ltr" aria-pressed="true">Отляво</button>
      <button data-o="rtl" aria-pressed="false">Отдясно</button>
    </div>
  </div>
  <div class="grp">
    <h3>Тема</h3>
    <div class="seg" id="themeSeg">
      <button data-t="auto" aria-pressed="true">Авто</button>
      <button data-t="light" aria-pressed="false">Светла</button>
      <button data-t="dark" aria-pressed="false">Тъмна</button>
    </div>
  </div>
</div>

<section class="hero" id="top">
  <svg class="arch" viewBox="0 0 120 90" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 84h100"/><path d="M22 84v-8c0-4 4-4 4-8 0-3 4-3 6-4M98 84v-8c0-4-4-4-4-8 0-3-4-3-6-4"/><path d="M32 64c0-18 12-26 28-38 16 12 28 20 28 38"/><path d="M60 26v-8"/><circle cx="60" cy="16" r="2"/></g><path d="M64 2a7 7 0 1 0 6 10 6 6 0 1 1-6-10z" fill="currentColor"/></svg>
  <h1>Мевлид-и Шериф</h1>
  <p>Оригиналният текст, транскрипция и превод на български език</p>
  <div class="cta">
    <a class="btn" href="#" id="startBtn">Започни четене</a>
    <button class="btn ghost" id="resumeBtn" hidden></button>
  </div>
  <ul class="toc" id="toc"></ul>
</section>

<main id="reader"></main>

<div class="focus" id="focus" role="dialog" aria-label="Бейт по бейт">
  <div class="f-top">
    <span class="where" id="fWhere"></span>
    <button class="ib" id="fClose" aria-label="Затвори">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="prog"><i id="fProg"></i></div>
  <div class="f-body" id="fBody"></div>
  <div class="f-nav">
    <button id="fPrev">Назад</button>
    <button id="fNext" class="next">Напред</button>

ىْ لَطٖيفْ"},{"tr":"Сенин олмазмъ дуалем ей шериф","bg":"нима двата свята не са твои, о, благородни?","ar":"سَنِكْ اُولْمَزْمٖى دُو عَالَمْ اَىْ شَرٖيفْ"}]},{"type":"beyt","h":[{"tr":"Затъма мир’ат единдим затънъ","bg":"Направих твоята същност огледало на Моята","ar":"ذٰاتِمَه مِرٰاتْ اٖيدِنْدِمْ ذٰاتِنٖى"},{"tr":"Биле яздъм адъм иле адънъ","bg":"и изписах името ти редом с Моето.“","ar":"بٖيلَه يٰازْدِمْ اٰدِمْ اٖيلَه اٰدٖينٖى"}]},{"type":"beyt","h":[{"tr":"Хем деди ким я Мухаммед бен сени","bg":"И още рече: „О, Мухаммед, Аз знам,","ar":"هَمْ دٖيدٖيكٖيمْ يٰا مُحَمَّدْ بَنْ سَنٖى"},{"tr":"Билюрем гьормейе доймазсън бени","bg":"че не можеш да се наситиш да Ме гледаш.","ar":"بٖيلُورَمْ كُورْ مَكَه طُويْمَزْسِنْ بَنٖى"}]},{"type":"beyt","h":[{"tr":"Лик варуп давет ет кулларъмъ","bg":"Но иди и призови Моите раби,","ar":"لٖيكْ وٰارُوبْ دَعْوَتْ اٖيتْ قُولْلَرٖيمٖي"},{"tr":"Та гелюбен гьорелер дидаръмъ","bg":"за да дойдат и те да видят лика Ми.“","ar":"تَا كَلُوبَنْ كُورَه لَرْدٖيدٰارٖيمٖى"}]},{"type":"beyt","h":[{"tr":"Хаккън емри иле ол шахи джихан","bg":"С повелята на Аллах Владетелят на света","ar":"حَقِّكْ اَمْرٖيلَه اُولْ شَاهِ جِهَانْ"},{"tr":"Юммеханъ евине гелди хеман","bg":"веднага се върна в дома на Юмму Хани.","ar":"اُمَّهَانٖى اَوٖينَه كَلْدٖى هَمَانْ"}]},{"type":"beyt","h":[{"tr":"Хер невакъй олду исе сертесер","bg":"Всичко, което се случи, от начало до край,","ar":"هَرْنَه وٰاقِعْ اُولْدٖى اٖيسَه سَرْتَسَرْ"},{"tr":"Джюмлесин асхабъна верди хабер","bg":"разказа на своите сподвижници.","ar":"جُمْلَه سِنْ اَصْحٰابِنَه وٖيرْدٖى خَبَرْ"}]},{"type":"beyt","h":[{"tr":"Дедилер ей къбле-и Ислями дин","bg":"Казаха: „О, посоко на исляма и вярата,","ar":"دٖيدٖيلَرْ اَىْ قِبْلَهِ اِسْلٰامِ دٖينْ"},{"tr":"Кутлу олсун сана мираджъ гюзин","bg":"нека е благословено избраното ти възнесение!","ar":"قُوتْلُو اُولْسُونْ سَكٰا مِعْرَاجٍ كُزٖينْ"}]},{"type":"beyt","h":[{"tr":"Биз камумуз кулларъз сен шахсън","bg":"Всички ние сме раби, а ти си владетел,","ar":"بِزْ قَمُومِزْ قُولْلَرِزْ سَنْ شَاهْسِكْ"},{"tr":"Гьонлюмюз ичинде рушен махсън","bg":"в сърцата ни ти си сияйна луна.","ar":"كُوكْلُمِزْ اٖيچِنْدَه رُوشَنْ مَاهْ سِكْ"}]},{"type":"beyt","h":[{"tr":"Юмметин олдугумуз девлет йетер","bg":"Достатъчно щастие е, че сме твоя умма,","ar":"اُمَّتِكْ اُولْدٖيغِمِزْ دَوْلَتْ يَتَرْ"},{"tr":"Хизметин кълдъгъмъз иззет йетер","bg":"достатъчна чест е, че ти служим.“","ar":"خِدْمَتِكْ قٖيلْدٖيغِمِزْ عِزَّتْ يَتَرْ"}]},{"type":"beyt","h":[{"tr":"Я иляхи ол Мухаммед хаккъчюн","bg":"Боже мой, заради онзи Мухаммед,","ar":"يٰا اِلٰهٖى اُولْ مُحَمَّدْ حِقّٖيچُونْ"},{"tr":"Ол шефаат кани Ахмет хаккъчюн","bg":"заради Ахмед, извора на застъпничеството,","ar":"اُولْ شَفَاعَتْ كٰانِ اَحْمَدْ حَقّٖيچُونْ"}]},{"type":"beyt","h":[{"tr":"Гьозю яшъ хаккъчюн ашъкларън","bg":"заради сълзите на влюбените,","ar":"كُوزٖى يَاشٖى حَقّٖيچُونْ عَاشِقْلَرِنْ"},{"tr":"Багръ башъ хаккъчюн садъкларън","bg":"заради изгорелите сърца на верните,","ar":"بَغْرٖى بَاشٖى حَقّٖيچُونْ صَادِقْلَرِكْ"}]},{"type":"beyt","h":[{"tr":"Биз гюнахкяр асъ мюджрим кулларъ","bg":"нас, грешните, непокорни, виновни раби,","ar":"بِزْ كُنَاهْكَارْ عَاصٖى مُجْرِمْ قُولْلَرٖى"},{"tr":"Ярлъгагъл ким гюнахлардан бери","bg":"прости ни и ни очисти от греховете.","ar":"يٰارْ لِغَاغِلْ كٖيمْ كُنَاهْلَرْدَنْ بَرٖى"}]},{"type":"beyt","h":[{"tr":"Сана ляйък кулларъйла хемдем ет","bg":"Направи ни другари на достойните Ти раби,","ar":"سَكَا لٰائِقْ قُولْلَرٖيلَه هَمْدَمْ اٖيتْ"},{"tr":"Ехли дердин сохбетине махрем ет","bg":"допусни ни в беседите на страдащите от любов.","ar":"اَهْلِ دَرْدِكْ صُحْبَتِنَه مَحْرَمْ اٖيتْ"}]},{"type":"beyt","h":[{"tr":"Аф едип исянъмъз къл рахмети","bg":"Прости непокорството ни и ни дари с милост","ar":"عَفْو اٖيدُوبْ عِصْيَانِمِزْ قٖيلْ رَحْمَتٖى"},{"tr":"Ол хабибин юзю сую хюрмети","bg":"в чест на достойнството на онзи Любимец.","ar":"اُولْ حَبٖيبِكْ يُوزٖى صُويٖي حُرْمَتٖى"}]},{"type":"beyt","h":[{"tr":"Я иляхи кълма бизи даллин","bg":"Боже мой, не ни прави заблудени –","ar":"يٰا اِلٰهٖى قٖيلْمَه بَزٖى ضَآلّٖينْ"},{"tr":"Бу дуая джюмлемиз дейин Амин","bg":"на тази молитва всички кажете „Амин“.","ar":"بُو دُعَايَه جُمْلَه كِزْ دَيِكْ آمٖينْ"}]},{"type":"beyt","h":[{"tr":"Юмметинден разъ олсун ол муин","bg":"Нека Помагащият е доволен от уммата му,","ar":"اُمَّتِنْدَنْ رٰاضٖى اُولْسُونْ اُولْ مُعٖينْ"},{"tr":"Рахметюллахи алейхим еджмеин","bg":"милостта на Аллах да бъде над всички тях.","ar":"رَحْمَةُ اللهِ عَلَيْهِمْ اَجْمَعٖينْ"}]}]}]</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const IMG_DIV = 2.15; // image px -> css px
  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem('mevlid:'+k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem('mevlid:'+k, JSON.stringify(v)); }catch(e){} }
  };
  const isRefrain = it => it.type==='beyt' && /^Гер дилер/.test(it.h[0].tr);

  // flatten
  const flat = []; // {sec, idx, it, id}
  DATA.forEach((s,si)=>{
    let n=0;
    s.items.forEach(it=>{
      if(it.type==='beyt'){ n++; flat.push({si, n, it, id:`b${si}-${n}`}); }
      else flat.push({si, n:null, it, id:`c${si}-${flat.length}`});
    });
    s.count=n;
  });

  const esc = t => t.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function hemHTML(h){
    return `<div class="hem"><div class="ar"><p class="art" lang="ar" dir="rtl">${esc(h.ar)}</p></div>`+
      `<div class="tr">${esc(h.tr)}</div><div class="bg">${esc(h.bg)}</div></div>`;
  }
  function itemHTML(f, inFocus){
    const it=f.it;
    if(it.type==='center') return `<div class="${inFocus?'f-card':'center'}">${hemHTML(it)}</div>`;
    const ref = isRefrain(it) ? ' refrain':'';
    if(inFocus) return `<div class="f-card${ref}">${hemHTML(it.h[0])}${hemHTML(it.h[1])}</div>`;
    return `<article class="beyt${ref}" id="${f.id}" data-k="${flat.indexOf(f)}"><span class="num" aria-label="Бейт ${f.n}">${f.n}</span><div class="hems">${hemHTML(it.h[0])}${hemHTML(it.h[1])}</div></article>`;
  }

  // build reader
  const reader=document.getElementById('reader'), toc=document.getElementById('toc'), jump=document.getElementById('jump');
  let html='';
  DATA.forEach((s,si)=>{
    html+=`<header class="sec-h" id="s${si}"><div class="orn" aria-hidden="true">✦</div><h2>${esc(s.title)}</h2><span class="n">${s.count} бейта</span></header>`;
    flat.filter(f=>f.si===si).forEach(f=>{ html+=itemHTML(f,false); });
    toc.insertAdjacentHTML('beforeend', `<li><a href="#s${si}">${esc(s.title)}<span>${s.count} бейта</span></a></li>`);
    jump.insertAdjacentHTML('beforeend', `<option value="s${si}">${esc(s.title)}</option>`);
  });
  html+=`<p class="endnote">Край на Мевлида</p>`;
  reader.innerHTML=html;
  jump.insertAdjacentHTML('afterbegin', `<option value="top">Съдържание</option>`);
  jump.addEventListener('change',()=>{ if(jump.value!=='top'&&!location.hash){try{history.pushState(null,'','#'+jump.value);}catch(_){}} document.getElementById(jump.value).scrollIntoView(); });
  document.getElementById('startBtn').addEventListener('click',e=>{ e.preventDefault(); try{history.pushState(null,'','#s0');}catch(_){} document.getElementById('s0').scrollIntoView(); });

  // settings
  const root=document.documentElement, panel=document.getElementById('panel'), setBtn=document.getElementById('setBtn');
  setBtn.addEventListener('click',e=>{ e.stopPropagation(); const o=panel.classList.toggle('open'); setBtn.setAttribute('aria-expanded',o); });
  document.addEventListener('click',e=>{ if(!panel.contains(e.target)){ panel.classList.remove('open'); setBtn.setAttribute('aria-expanded',false);} });
  const STEPS=[0.7,0.8,0.9,1,1.15,1.3,1.5,1.75,2];
  const opts = Object.assign({ar:true,tr:true,bg:true,sar:1,str:1,sbg:1,order:'ltr',theme:'auto'}, store.get('opts')||{});
  if(opts.scale){ opts.str=opts.sbg=opts.sar=opts.scale; delete opts.scale; }
  function apply(){
    ['ar','tr','bg'].forEach(k=>document.body.classList.toggle('hide-'+k,!opts[k]));
    root.style.setProperty('--s-ar',opts.sar); root.style.setProperty('--s-tr',opts.str); root.style.setProperty('--s-bg',opts.sbg);
    document.body.classList.toggle('rtl',opts.order==='rtl');
    document.querySelectorAll('.step').forEach(r=>{
      const v=opts[r.dataset.k], i=STEPS.indexOf(v);
      r.querySelector('output').textContent=Math.round(v*100)+'%';
      r.querySelector('[data-d="-1"]').disabled=i<=0; r.querySelector('[data-d="1"]').disabled=i>=STEPS.length-1;
    });
    document.querySelectorAll('#orderSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.o===opts.order));
    if(opts.theme==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',opts.theme);
    document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===opts.theme));
    store.set('opts',opts);
  }
  [['optAr','ar'],['optTr','tr'],['optBg','bg']].forEach(([id,k])=>{
    const el=document.getElementById(id); el.checked=opts[k];
    el.addEventListener('change',()=>{
      opts[k]=el.checked;
      if(!opts.ar&&!opts.tr&&!opts.bg){ opts[k]=true; el.checked=true; }
      apply();
    });
  });
  document.querySelectorAll('.step').forEach(r=>r.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const k=r.dataset.k; let i=STEPS.indexOf(opts[k]); if(i<0) i=3;
    i=Math.max(0,Math.min(STEPS.length-1,i+(+b.dataset.d))); opts[k]=STEPS[i]; apply();
  })));
  document.querySelectorAll('#orderSeg button').forEach(b=>b.addEventListener('click',()=>{opts.order=b.dataset.o;apply();}));
  document.querySelectorAll('#themeSeg button').forEach(b=>b.addEventListener('click',()=>{opts.theme=b.dataset.t;apply();}));
  apply();

  // reading position
  let current = store.get('pos');
  const beyts=[...reader.querySelectorAll('.beyt')];
  const visible=new Set();
  const io=new IntersectionObserver(ents=>{
